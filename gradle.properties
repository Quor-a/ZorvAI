org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableResourceOptimizations=false
android.enableArtProfile=false
android.experimental.enableArtProfile=false
android.versionControlInfoEnabled=false
kotlin.code.style=official

# GitHub 登录方式（无需硬编码凭据）：
#  - Token 登录：用户在 GitHub 网页生成 Personal Access Token 后粘贴登录（默认、开箱即用）。
#  - OAuth 设备流：在 github.com/settings/developers 新建 OAuth App，把 Client ID 填到登录屏即可（无需 Secret / 回调地址）。
# 以下两项可选：构建期内置 OAuth App 的 Client ID（留空则由用户在登录屏填写）。
GITHUB_CLIENT_ID=
GITHUB_CLIENT_SECRET=
