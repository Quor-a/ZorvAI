org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableResourceOptimizations=false
android.enableArtProfile=false
android.experimental.enableArtProfile=false
android.versionControlInfoEnabled=false
kotlin.code.style=official

# GitHub 登录（应用内 WebView OAuth 授权码流程 + PKCE，与 operit 一致，无需填写 Token / Secret）：
# 在 github.com/settings/developers 新建 OAuth App，Authorization callback URL 填 zorv://github-oauth-callback，
# 把得到的 Client ID 填到下面，重新构建后登录屏即「一键授权」。留空则登录屏提示「未配置」。
GITHUB_CLIENT_ID=
