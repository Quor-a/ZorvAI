package com.oppo.push.proto;

option java_multiple_files = true;

option java_package = "com.oppo.push.proto"; //java包名

//============================================   长连接PB  ========================================================
//连接元数据
message ConnectionMetaData {
    optional string timezone_code = 1; // 时区编码 默认：GMT+08:00
    optional string region_code = 2; // 区域代码
    optional string networkType = 3; // 网络类型  WIFI、2G、3G、4G、5G、UNKNOWN
    optional string locationX = 4; // 地理位置纬度 已废弃
    optional string locationY = 5; //地理位置经度 已废弃
    optional string province = 6; //省份 已废弃
    optional string city = 7; //城市 已废弃
    optional string wifi_ssid = 8; //wifi ssid 已废弃
    optional string district = 9; //区 已废弃
    optional bool isReset = 10; //设备是否重置 需要客户端判断设备是否发生了重置
    optional string resetTime = 11; //客户端的重置时间(unixtime，单位秒) 仅供服务端参考
    optional string mcsVersion = 12; //版本
    optional string model = 13; //设备机型
    optional string duid = 14; //开发者匿名标识 VAID
    optional string ouid = 15; //用户匿名标识 OAID
}
//长连接服务端中间件sdk 上行数据
message ConnectUplinkData {
    optional string serverName = 1; // 服务名
    optional string cmd = 2; // 命令字
    optional string clientId = 3; // 客户端标示id
    optional string clientIp = 4; // 客户端ip
    optional string clientPort = 5; //客户端端口
    optional string connectIp = 6; //服务端IP
    optional string connectPort = 7; //服务端端口
    optional string dataPayload = 8; //业务数据payload string
    optional string messageId = 9; //消息id
    optional string source = 10; //client请求网关来源：ws,tcp,quic,http
}

//长连接服务端中间件sdk 下行数据
message ConnectDownlinkData {
    optional string clientId = 1; // 客户端标示id
    optional string dataPayload = 2; //业务数据payload string
    optional string messageId = 3; //消息id
    optional string cmdLatest = 4; //下行cmd最新命令
}

//长连接服务端cmd 数据
message ConnectCmdData {
    optional string clientId = 1; // 客户端标示id
    optional string cmdType = 2; //cmd命令类型
    optional string ext = 3; //cmd扩展字段
    optional string dataPayload = 4; //业务数据payload string
    optional string messageId = 5; //消息id
}

//长连接sdk 连接元数据
message LcConnectionMetaData {
    optional string messageId = 1; //消息id
    optional string appPackage = 2; //业务包标示
    optional string networkType = 3; // 网络类型  WIFI、2G、3G、4G、5G、UNKNOWN
    optional string locationX = 4; // 地理位置纬度 已废弃
    optional string locationY = 5; //地理位置经度 已废弃
    optional string wifi_ssid = 6; //wifi ssid 已废弃
    optional string model = 7; //设备机型
    optional string duid = 8; //开发者匿名标识 VAID
    optional string ouid = 9; //用户匿名标识 OAID
    optional string ext = 10; //业务扩展连接字段
    optional string serverName = 11; //业务建联
    optional string source = 12; //client请求网关来源：ws,tcp,quic,http
}