<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>ZorvAI Live2D</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: transparent;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { width: 100%; height: 100%; display: block; touch-action: none; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #8a93a6; font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    pointer-events: none;
  }
  #loading.hide { display: none; }
  .spin {
    width: 30px; height: 30px; margin-right: 10px; border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #6ea8fe; border-radius: 50%; animation: spin 0.9s linear infinite; display: inline-block; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="loading"><span class="spin"></span>正在加载 Live2D 模型…</div>

<!-- 诊断：全局错误捕获（最先注册，捕获后续脚本加载失败与运行时抛错，直接上报到状态栏 + 调试日志） -->
<script>
(function () {
  function report(msg) {
    try { console.error("[L2D-DIAG] " + msg); } catch (_) {}
    try {
      if (window.ZorvBridge && window.ZorvBridge.postMessage)
        window.ZorvBridge.postMessage(JSON.stringify({ event: "error", data: { message: msg } }));
    } catch (_) {}
  }
  window.addEventListener("error", function (e) {
    try {
      var t = e.target;
      if (t && t.tagName === "SCRIPT") {
        report("脚本加载失败: " + String(t.src || "").split("/").pop());
      } else if (t && (t.tagName === "IMG" || t.tagName === "LINK")) {
        /* 图片/链接 404 不上报，避免噪音 */
      } else {
        report("页面错误: " + (e.message || "unknown") + (e.filename ? " [" + String(e.filename).split("/").pop() + ":" + (e.lineno || 0) + "]" : ""));
      }
    } catch (_) {}
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    try { report("Promise异常: " + String(e.reason && e.reason.message || e.reason || e)); } catch (_) {}
  });
  window.__l2dLog = function (msg) { try { console.log("[L2D] " + msg); } catch (_) {} };
})();
</script>
<!-- 运行时优先（与 DesktopFriends 一致：先 Cubism 运行时，再 PixiJS，最后 pixi-live2d-display） -->
<script src="live2d.min.js" onload="window.__l2dLog('live2d.min.js ok, Live2D='+(typeof window.Live2D))"></script>
<script src="live2dcubismcore.min.js" onload="window.__l2dLog('live2dcubismcore.min.js ok, Core='+(typeof window.Live2DCubismCore))"></script>
<script src="pixi.min.js" onload="window.__l2dLog('pixi.min.js ok, PIXI='+(typeof window.PIXI))"></script>
<script src="pixi-live2d-display.min.js" onload="window.__l2dLog('pixi-live2d-display.min.js ok, L2DM='+(typeof (window.PIXI&&window.PIXI.live2d&&window.PIXI.live2d.Live2DModel)))"></script>
<script>
(function () {
  "use strict";

  // 兼容 pixi-live2d-display 对全局 PIXI 的依赖
  if (typeof PIXI !== "undefined") { window.PIXI = PIXI; }

  // pixi-live2d-display 0.4.0 UMD 将 Live2DModel 挂在 PIXI.live2d.Live2DModel（非 window.Live2DModel）
  var Live2DModel = (typeof PIXI !== "undefined" && PIXI.live2d && PIXI.live2d.Live2DModel)
    ? PIXI.live2d.Live2DModel
    : (typeof window.Live2DModel !== "undefined" ? window.Live2DModel : undefined);

  var canvas = document.getElementById("stage");
  var loadingEl = document.getElementById("loading");

  var app = null;
  var model = null;
  var baseScale = 1;
  var defaultModelPath = "models/Hiyori/Hiyori.model3.json";

  // 标准 Cubism 参数情绪映射（无表情文件时作为兜底，适用于任意 Cubism 4 模型）
  var EMOTION_PARAMS = {
    neutral:   {},
    happy:     { ParamMouthForm: -1.0, ParamBrowY: 0.35, ParamCheek: 0.7, ParamEyeLOpen: 1.0, ParamEyeROpen: 1.0 },
    angry:     { ParamBrowY: -0.8, ParamBrowX: 0.35, ParamMouthForm: 0.5, ParamAngleZ: 0.12 },
    sad:       { ParamBrowY: 0.6, ParamBrowX: -0.45, ParamMouthForm: 0.55, ParamEyeLOpen: 0.4, ParamEyeROpen: 0.4 },
    surprised: { ParamBrowY: 0.7, ParamEyeLOpen: 1.0, ParamEyeROpen: 1.0, ParamMouthOpenY: 0.5 },
    relaxed:   { ParamMouthForm: -0.45, ParamBrowY: 0.15 },
    thinking:  { ParamBrowY: 0.4, ParamBrowX: 0.2, ParamAngleX: -0.1 }
  };

  // 情绪 -> 表情文件名尝试（模型自带表情文件时优先）
  var EMOTION_EXPR = {
    happy: ["happy", "f01", "joy", "smile"],
    angry: ["angry", "f02", "mad"],
    sad: ["sad", "f03", "cry"],
    surprised: ["surprised", "f04", "shock"],
    relaxed: ["relaxed", "f05", "calm"],
    thinking: ["thinking", "f06"],
    neutral: ["neutral", "f00"]
  };

  var emotionTarget = {};     // 目标参数值
  var emotionCurrent = {};    // 当前(已平滑)参数值
  var speaking = false;
  var speakUntil = 0;
  var availableExpressions = [];
  var availableMotions = {};

  function notify(event, data) {
    try {
      if (window.ZorvBridge && window.ZorvBridge.postMessage) {
        window.ZorvBridge.postMessage(JSON.stringify({ event: event, data: data || {} }));
      }
    } catch (e) { /* ignore */ }
  }

  function hideLoading() { if (loadingEl) loadingEl.className = "hide"; }
  function showLoading() { if (loadingEl) loadingEl.className = ""; }

  function applyTransform(scale, offsetX, offsetY) {
    if (!model || !app) return;
    var finalScale = baseScale * (scale == null ? 1 : scale);
    var cx = app.screen.width / 2;
    var cy = app.screen.height / 2;
    var ox = (offsetX == null ? 0 : offsetX) / 100 * app.screen.width;
    var oy = (offsetY == null ? 0 : offsetY) / 100 * app.screen.height;
    model.scale.set(finalScale);
    model.position.set(cx + ox, cy + oy);
  }

  function calcModelSize(m) {
    var w = m.width || 0;
    var h = m.height || 0;
    if (!w || !h) {
      try {
        var im = m.internalModel;
        if (im) {
          var cmw = im.width || (im.coreModel && im.coreModel.getCanvasWidth && im.coreModel.getCanvasWidth());
          var cmh = im.height || (im.coreModel && im.coreModel.getCanvasHeight && im.coreModel.getCanvasHeight());
          if (cmw && cmh) { w = cmw; h = cmh; }
        }
      } catch (e) { console.warn("calcModelSize fallback", e); }
    }
    return { width: w || 1, height: h || 1 };
  }

  function calcBaseScale(m) {
    var size = calcModelSize(m);
    var s = Math.min(app.screen.width / size.width, app.screen.height / size.height) * 0.8;
    if (!isFinite(s) || s <= 0) s = 1;
    window.__l2dLog("baseScale=" + s.toFixed(4) + " model=" + size.width + "x" + size.height + " screen=" + app.screen.width + "x" + app.screen.height);
    return s;
  }

  function refreshCanvas() {
    if (!app || !canvas.parentElement) return;
    var parent = canvas.parentElement;
    var w = parent.clientWidth || window.innerWidth || app.screen.width;
    var h = parent.clientHeight || window.innerHeight || app.screen.height;
    app.renderer.resize(w, h);
    if (model) {
      baseScale = calcBaseScale(model);
      applyTransform(1, 0, 0);
    }
  }

  function collectModelInfo() {
    availableExpressions = [];
    availableMotions = {};
    try {
      var mm = model.internalModel && model.internalModel.motionManager;
      if (mm && mm.definitions) {
        for (var g in mm.definitions) {
          if (mm.definitions[g] && mm.definitions[g].length) {
            availableMotions[g] = mm.definitions[g].length;
          }
        }
      }
      var em = mm && mm.expressionManager;
      if (em && em.definitions) {
        em.definitions.forEach(function (d) { availableExpressions.push(d.name || d.Name || "unknown"); });
      }
    } catch (e) { console.warn("collectModelInfo", e); }
  }

  function loadModel(path) {
    if (!app || !path) return Promise.resolve(false);
    showLoading();
    if (model) { app.stage.removeChild(model); model.destroy(); model = null; }
    emotionTarget = {}; emotionCurrent = {}; speaking = false;

    window.__l2dLog("开始加载模型: " + path);
    var done = false;
    setTimeout(function () {
      if (!done) notify("error", { message: "模型加载超时(20s): " + path });
    }, 20000);
    return Live2DModel.from(path, { autoInteract: true, autoUpdate: true }).then(function (m) {
      done = true;
      model = m;
      baseScale = calcBaseScale(model);
      model.anchor.set(0.5, 0.5);
      applyTransform(1, 0, 0);
      app.stage.addChild(model);
      collectModelInfo();
      try { model.motion("Idle"); } catch (e) { /* no idle */ }

      model.on("hit", function (areas) {
        if (areas.indexOf("body") >= 0 || areas.indexOf("Body") >= 0) {
          try { model.motion("TapBody"); } catch (e) {}
          setEmotion("happy", 2500);
        }
      });

      hideLoading();
      var sz = calcModelSize(model);
      var diagInfo = "size=" + sz.width + "x" + sz.height
        + " scale=" + model.scale.x.toFixed(4)
        + " pos=" + Math.round(model.position.x) + "," + Math.round(model.position.y)
        + " renderer=" + (app.renderer.type === PIXI.RENDERER_TYPE.WEBGL ? "WEBGL" : "CANVAS");
      window.__l2dLog("模型就绪: " + diagInfo);
      notify("ready", {
        path: path,
        emotions: window.ZorvLive2D.emotions(),
        expressions: availableExpressions,
        motions: availableMotions,
        diag: diagInfo
      });
      return true;
    }).catch(function (e) {
      done = true;
      console.error("loadModel failed", e);
      hideLoading();
      notify("error", { message: String(e && e.message || e) });
      return false;
    });
  }

  // 情绪：优先使用模型自带表情文件，否则回落到标准参数
  function setEmotion(name, autoResetMs) {
    name = name || "neutral";
    // 重置参数目标
    emotionTarget = {};
    if (EMOTION_PARAMS[name]) {
      for (var k in EMOTION_PARAMS[name]) emotionTarget[k] = EMOTION_PARAMS[name][k];
    }
    // 尝试表情文件
    var tried = false;
    if (availableExpressions.length && EMOTION_EXPR[name]) {
      for (var i = 0; i < EMOTION_EXPR[name].length; i++) {
        if (availableExpressions.indexOf(EMOTION_EXPR[name][i]) >= 0) {
          try { model.expression(EMOTION_EXPR[name][i]); tried = true; } catch (e) {}
          break;
        }
      }
    }
    notify("emotion", { name: name, viaExpression: tried });
    if (autoResetMs && name !== "neutral") {
      setTimeout(function () { setEmotion("neutral"); }, autoResetMs);
    }
  }

  function playMotion(group, index) {
    if (!model) return;
    try {
      if (typeof index === "number") model.motion(group, index);
      else model.motion(group);
    } catch (e) { console.warn("playMotion", e); }
  }

  // 说话：驱动 ParamMouthOpenY 口型包络，可选配合 idle 动作
  function speak(text, durationMs) {
    if (!model) return;
    var ms = durationMs || Math.max(1400, (text || "").length * 70);
    speaking = true;
    speakUntil = performance.now() + ms;
    try { model.motion("Idle"); } catch (e) {}
  }

  function perFrame() {
    if (!model || !model.internalModel) return;
    var cm = model.internalModel.coreModel;
    if (!cm) return;
    // 情绪参数平滑应用
    for (var id in emotionTarget) {
      var tgt = emotionTarget[id];
      var cur = emotionCurrent[id] || 0;
      cur += (tgt - cur) * 0.12;
      emotionCurrent[id] = cur;
      if (id !== "ParamMouthOpenY") cm.setParamValue(id, cur);
    }
    // 说话口型：仅在未由情绪显式控制嘴部时叠加
    if (speaking) {
      var phase = (performance.now() % 380) / 380;
      var open = (Math.sin(phase * Math.PI * 2) * 0.5 + 0.5) * 0.85;
      cm.setParamValue("ParamMouthOpenY", open);
      if (performance.now() > speakUntil) {
        speaking = false;
        cm.setParamValue("ParamMouthOpenY", 0);
      }
    }
  }

  window.ZorvLive2D = {
    loadModel: function (p) { return loadModel(p); },
    setEmotion: function (n, ms) { setEmotion(n, ms); },
    playMotion: function (g, i) { playMotion(g, i); },
    speak: function (t, ms) { speak(t, ms); },
    setTransform: function (s, ox, oy) { applyTransform(s, ox, oy); },
    isReady: function () { return !!model; },
    emotions: function () { return Object.keys(EMOTION_PARAMS); },
    expressions: function () { return availableExpressions.slice(); },
    motions: function () { return availableMotions; },
    defaultModel: function () { return defaultModelPath; }
  };

  function init() {
    // 全局对象存在性诊断（输出到调试日志，定位缺失的运行时）
    var diag = "PIXI=" + (typeof PIXI !== "undefined" ? "ok" : "MISS")
      + " Live2D=" + (typeof window.Live2D !== "undefined" ? "ok" : "MISS")
      + " Core=" + (typeof window.Live2DCubismCore !== "undefined" ? "ok" : "MISS")
      + " L2DM=" + (typeof Live2DModel !== "undefined" ? "ok" : "MISS")
      + " size=" + window.innerWidth + "x" + window.innerHeight;
    window.__l2dLog("环境检查 " + diag);
    if (typeof PIXI === "undefined") { notify("error", { message: "PIXI 未加载 (" + diag + ")" }); return; }
    if (typeof Live2DModel === "undefined") { notify("error", { message: "pixi-live2d-display 未加载 (" + diag + ")" }); return; }

    // 等待一帧，确保 canvas 父元素尺寸稳定（与 DesktopFriends 一致）
    requestAnimationFrame(function () {
      var parent = canvas.parentElement;
      var width = (parent && parent.clientWidth) || window.innerWidth || 1;
      var height = (parent && parent.clientHeight) || window.innerHeight || 1;
      window.__l2dLog("画布容器尺寸 " + width + "x" + height);
      try {
        app = new PIXI.Application({
          view: canvas,
          backgroundAlpha: 0,
          width: width,
          height: height,
          antialias: true
        });
      } catch (e) {
        notify("error", { message: "PIXI初始化失败: " + String(e && e.message || e) });
        return;
      }
      window.__l2dLog("PIXI Application 就绪, renderer=" + (app.renderer.type === PIXI.RENDERER_TYPE.WEBGL ? "WEBGL" : "CANVAS"));
      app.ticker.add(perFrame);
      window.addEventListener("resize", refreshCanvas);
      window.addEventListener("orientationchange", refreshCanvas);
      loadModel(defaultModelPath);
    });
  }

  if (document.readyState === "loading") {
    window.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
