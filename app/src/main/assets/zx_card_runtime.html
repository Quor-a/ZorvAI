<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZorvAI Web UI</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   ZorvAI Web UI 设计系统
   第三个对话框的网页渲染层：由 zx 组件契约编译生成，
   不是预设卡片形状。所有视觉走 CSS 自定义属性，主题一键切换。
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --surface-3:#e9ecf1;
  --line:#e2e6ec; --line-strong:#cfd5de;
  --fg:#12161c; --fg-2:#4a5462; --fg-3:#8a94a3;
  --accent:#3b6cf6; --accent-fg:#ffffff; --accent-soft:#e8eeff;
  --ok:#1f9d5a; --ok-soft:#e6f5ec;
  --warn:#c77700; --warn-soft:#fdf1de;
  --err:#d8423c; --err-soft:#fbe9e8;
  --radius:14px; --radius-s:9px;
  --shadow:0 1px 2px rgba(16,22,28,.06),0 6px 18px rgba(16,22,28,.06);
  --tap:44px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
:root.dark{
  --bg:#101216; --surface:#171a20; --surface-2:#1e222a; --surface-3:#262b34;
  --line:#2a2f39; --line-strong:#3a414e;
  --fg:#eef1f6; --fg-2:#aeb6c4; --fg-3:#7d8595;
  --accent:#6f9bff; --accent-fg:#0c1220; --accent-soft:#1b2438;
  --ok:#3ecf8e; --ok-soft:#12291f;
  --warn:#f0a63c; --warn-soft:#2b2113;
  --err:#ff6b63; --err-soft:#2d1716;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--sans);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app{max-width:760px;margin:0 auto;padding:12px 14px 40px;display:flex;flex-direction:column;gap:12px}

/* ── 头部 ── */
.hd{display:flex;align-items:center;gap:10px;min-height:38px}
.hd-t{font-size:16px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{
  font-family:var(--mono); font-size:11px; padding:3px 8px; border-radius:999px;
  background:var(--accent-soft); color:var(--accent); border:1px solid var(--line);
  max-width:46%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex-shrink:0;
}
.hd-b{
  min-width:34px;height:34px;border:1px solid var(--line);background:var(--surface);
  color:var(--fg-2);border-radius:var(--radius-s);font-size:12px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;padding:0 9px;
}
.hd-b:active{background:var(--surface-3)}

/* ── 区块 ── */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.sec-t{
  font-size:12px;font-weight:650;color:var(--fg-3);letter-spacing:.04em;
  padding:11px 14px 7px;text-transform:uppercase;
}
.sec-b{padding:4px 14px 14px}
.hint{font-size:12px;color:var(--fg-3);padding:8px 14px 12px;line-height:1.5}
.empty{padding:36px 18px;text-align:center;color:var(--fg-3);font-size:13px}

/* ── 指标卡组 ── */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.met{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-s);
  padding:12px 13px;cursor:pointer;transition:transform .12s ease,border-color .12s ease;
  min-height:var(--tap);
}
.met:active{transform:scale(.985);border-color:var(--accent)}
.met-k{font-size:12px;color:var(--fg-3);margin-bottom:3px}
.met-v{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2;word-break:break-word}
.met-d{font-size:12px;color:var(--fg-2);margin-top:4px}
.met .up{color:var(--ok)} .met .down{color:var(--err)}

/* ── 表格 ── */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th{font-size:12px;color:var(--fg-3);font-weight:600;background:var(--surface-2)}
table.t tbody tr{cursor:pointer;transition:background .1s}
table.t tbody tr:active{background:var(--accent-soft)}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
table.t td:last-child,table.t th:last-child{white-space:normal}

/* ── 列表 ── */
.lst{display:flex;flex-direction:column}
.li{
  display:flex;gap:11px;align-items:flex-start;padding:12px 14px;
  border-bottom:1px solid var(--line);cursor:pointer;min-height:var(--tap);
  transition:background .1s;text-align:left;background:none;border-left:0;border-right:0;border-top:0;
  width:100%;color:inherit;font:inherit;
}
.li:last-child{border-bottom:0}
.li:active{background:var(--accent-soft)}
.li-i{flex:1;min-width:0}
.li-t{font-size:14px;font-weight:550}
.li-d{font-size:12.5px;color:var(--fg-2);margin-top:2px}
.li-m{font-size:11.5px;color:var(--fg-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.li-r{flex-shrink:0;align-self:center}
.idx{
  width:24px;height:24px;border-radius:7px;background:var(--surface-3);color:var(--fg-2);
  font-size:11px;font-family:var(--mono);display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

/* ── 状态徽章 ── */
.st{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.st-ok,.st-done,.st-active,.st-pass,.st-success{background:var(--ok-soft);color:var(--ok)}
.st-warn,.st-pending,.st-run,.st-wait{background:var(--warn-soft);color:var(--warn)}
.st-err,.st-fail,.st-block{background:var(--err-soft);color:var(--err)}
.st-info,.st-todo,.st-idle{background:var(--surface-3);color:var(--fg-2)}

/* ── 步骤 / 时间线 ── */
.steps{display:flex;flex-direction:column}
.stp{display:flex;gap:12px;padding:11px 14px;cursor:pointer;min-height:var(--tap);transition:background .1s}
.stp:active{background:var(--accent-soft)}
.stp-dot{
  width:11px;height:11px;border-radius:50%;background:var(--line-strong);flex-shrink:0;margin-top:6px;
  box-shadow:0 0 0 3px var(--surface);
}
.stp.cur .stp-dot{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.stp.done .stp-dot{background:var(--ok)}
.stp-b{flex:1;min-width:0}
.stp-t{font-size:14px;font-weight:550}
.stp.cur .stp-t{color:var(--accent)}
.stp-d{font-size:12.5px;color:var(--fg-2);margin-top:2px}
.stp-m{font-size:11.5px;color:var(--fg-3);margin-top:3px;font-family:var(--mono)}

/* ── 表单 ── */
.fm{display:flex;flex-direction:column;gap:12px;padding:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld-l{font-size:12.5px;color:var(--fg-2);font-weight:550}
.fld input,.fld textarea,.fld select{
  font:inherit;font-size:15px;color:var(--fg);background:var(--surface-2);
  border:1px solid var(--line-strong);border-radius:var(--radius-s);
  padding:10px 12px;width:100%;min-height:var(--tap);
}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.opt-row{display:flex;flex-wrap:wrap;gap:8px}
.btn{
  font:inherit;font-size:14.5px;font-weight:600;min-height:var(--tap);padding:10px 18px;
  border-radius:var(--radius-s);border:1px solid var(--line-strong);
  background:var(--surface-2);color:var(--fg);cursor:pointer;transition:transform .1s,background .12s;
}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn-w{width:100%}

/* ── 选项卡 ── */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  font:inherit;font-size:13.5px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--fg-2);cursor:pointer;white-space:nowrap;min-height:36px;
}
.tab.on{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:600}

/* ── 图表 ── */
.chart{width:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:4px 14px 12px;font-size:12px;color:var(--fg-2)}
.lg-i{display:inline-flex;align-items:center;gap:5px}
.rule{display:flex;align-items:center;gap:10px;padding:16px 14px}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:var(--line)}
.rule-t{font-size:12px;color:var(--fg-3);white-space:nowrap}
.hero{padding:24px 14px 18px;text-align:center}
.hero-v{font-size:44px;font-weight:700;line-height:1.05;font-family:var(--mono);color:var(--accent);letter-spacing:-.5px;word-break:break-all}
.hero-u{font-size:15px;color:var(--fg-2);margin-left:3px;font-weight:500}
.hero-s{font-size:12.5px;color:var(--fg-3);margin-top:8px}
.mtx{border-collapse:collapse;width:calc(100% - 28px);margin:12px 14px;font-family:var(--mono);font-size:12px}
.mtx th{font-family:var(--sans);font-size:11px;color:var(--fg-3);font-weight:500;padding:4px 6px;text-align:center;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtx td{padding:6px 5px;text-align:center;border-radius:5px;cursor:pointer;min-width:30px}
.mtx td.lo{background:var(--surface-3);color:var(--fg-2)}
.mtx td.md{background:var(--accent-soft);color:var(--accent)}
.mtx td.hi{background:var(--accent);color:var(--accent-fg);font-weight:600}
.lg-s{width:9px;height:9px;border-radius:2px;flex-shrink:0}

/* ── 看板 ── */
.kb{display:flex;gap:10px;overflow-x:auto;padding:12px;align-items:flex-start;scrollbar-width:none}
.kb::-webkit-scrollbar{display:none}
.kb-c{flex:0 0 74%;min-width:210px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px}
.kb-h{font-size:12.5px;font-weight:650;color:var(--fg-2);margin-bottom:8px;display:flex;justify-content:space-between}
.kb-i{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);
  padding:10px 11px;margin-bottom:8px;cursor:pointer;font-size:13.5px;transition:transform .1s;
}
.kb-i:active{transform:scale(.98);border-color:var(--accent)}
.kb-i:last-child{margin-bottom:0}

/* ── 标签 ── */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.chip{
  font-size:13px;padding:6px 12px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--fg-2);cursor:pointer;min-height:32px;
  display:inline-flex;align-items:center;gap:5px;transition:transform .1s;
}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:600}

/* ── 提示条 ── */
.note{
  display:flex;gap:10px;padding:12px 14px;border-radius:var(--radius-s);
  border:1px solid var(--line);background:var(--surface-2);font-size:13.5px;
}
.note.ok{background:var(--ok-soft);border-color:transparent}
.note.warn{background:var(--warn-soft);border-color:transparent}
.note.err{background:var(--err-soft);border-color:transparent}
.note-i{flex-shrink:0;font-size:15px}

/* ── 终端 ── */
.term{
  background:#0c0f14;color:#d6e0ea;font-family:var(--mono);font-size:12.5px;line-height:1.65;
  padding:12px 14px;overflow-x:auto;white-space:pre;border-radius:0;
}
:root:not(.dark) .term{background:#11151c}
.term .p{color:#5eead4}
.term .e{color:#ff8080}
.term .w{color:#fbbf24}

/* ── 差异 ── */
.diff{font-family:var(--mono);font-size:12.5px;line-height:1.7;overflow-x:auto}
.dl{display:flex;gap:10px;padding:1px 14px;white-space:pre}
.dl .g{color:var(--fg-3);flex-shrink:0;width:20px;text-align:right;user-select:none}
.dl.add{background:var(--ok-soft);color:var(--ok)}
.dl.del{background:var(--err-soft);color:var(--err)}
.dl.hunk{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* ── 进度 / 仪表 ── */
.pb{height:8px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.pb-f{height:100%;background:var(--accent);border-radius:999px;transition:width .3s ease}
.pb-f.ok{background:var(--ok)} .pb-f.warn{background:var(--warn)} .pb-f.err{background:var(--err)}
.gauge-row{display:flex;align-items:center;gap:12px;padding:11px 14px}
.gauge-row .pb{flex:1}

/* ── 评分 ── */
.rate{display:flex;gap:4px;padding:12px 14px}
.rate-s{font-size:24px;color:var(--line-strong);cursor:pointer;line-height:1;transition:transform .1s,color .12s}
.rate-s:active{transform:scale(1.18)}
.rate-s.on{color:#f5a623}

/* ── 树 / 组织 ── */
.tree{padding:8px 14px 14px;font-size:13.5px}
.tn{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:var(--radius-s);cursor:pointer;min-height:36px}
.tn:active{background:var(--accent-soft)}
.tn-tw{cursor:pointer;color:var(--fg-3);width:18px;text-align:center;flex-shrink:0;user-select:none;font-size:11px}
.tn-t{flex:1;min-width:0}
.tn-k{padding-left:22px}

/* ── 键值 ── */
.kv{padding:4px 14px 12px;margin:0}
.kv-r{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv-r:last-child{border-bottom:0}
.kv-k{color:var(--fg-3);flex:0 0 38%;min-width:0}
.kv-v{flex:1;min-width:0;word-break:break-word}

/* ── 媒体 ── */
.media{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.media img,.media video{width:100%;border-radius:var(--radius-s);display:block;background:var(--surface-3)}

/* ── 日历 / 热力 ── */
.cal{padding:12px 14px}
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.cal-h div{text-align:center;font-size:11px;color:var(--fg-3)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cd{
  aspect-ratio:1;border-radius:8px;background:var(--surface-3);display:flex;
  align-items:center;justify-content:center;font-size:12px;color:var(--fg-2);
  cursor:pointer;border:1px solid transparent;transition:transform .1s;
}
.cd:active{transform:scale(.92)}
.cd.on{background:var(--accent);color:var(--accent-fg);font-weight:650}
.cd.hot{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* ── DSL 原文 ── */
.raw{
  font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--fg-2);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-s);
  padding:12px;overflow:auto;max-height:44vh;white-space:pre;margin:0 14px 14px;
}
.foot{text-align:center;font-size:11px;color:var(--fg-3);padding:6px 0 2px}
.err-box{padding:14px;color:var(--err);font-size:13px;font-family:var(--mono);white-space:pre-wrap}
</style>
</head>
<body>
<div id="app">
  <div class="hd">
    <div class="hd-t" id="t"></div>
    <div class="badge" id="c"></div>
    <button class="hd-b" id="rawBtn">DSL</button>
  </div>
  <div id="body"></div>
  <div class="foot">ZorvAI 第三个对话框 · Web UI · 交互会回传宿主</div>
</div>

<!-- zx 组件字段契约：宿主构建时把 zx_contracts.json 原文注入此处 -->
<script type="application/json" id="zx-contracts">/*__ZX_CONTRACTS__*/</script>

<script>
/* ═══════════════════════════════════════════════════════════════
   0. 组件契约（构建时由宿主从 zx_contracts.json 注入，
      内容来自 zxwidget 的 ZxDsl* 真实字段规格——编译器按它落位，不猜）
   ═══════════════════════════════════════════════════════════════ */
var ZX_CONTRACTS = (function(){
  try{
    var n = document.getElementById("zx-contracts");
    if(!n) return {};
    var raw = JSON.parse(n.textContent);
    /* 注入的是整包 {components,contracts}，消费点要的是内层契约映射 */
    return (raw && typeof raw === "object" && raw.contracts && typeof raw.contracts === "object") ? raw.contracts : raw;
  }catch(e){ return {}; }
})();

/* ═══════════════════════════════════════════════════════════════
   2. 字段槽位映射：zx 的字段词汇高度规则，这里做一次语义归一。
   n/v/t/k 是主力；s/d/a/b/w 视上下文分别是起止/描述/动作/背景/宽度。
   ═══════════════════════════════════════════════════════════════ */
var TXT_KEYS  = ["n","t","k","label","title","name","text","q","head","cap","caption"];
var VAL_KEYS  = ["v","value","val","cnt","count","num","amount","score","p"];
var SUB_KEYS  = ["d","desc","detail","why","note","body","content","msg","summary","sub"];
var WHO_KEYS  = ["who","by","user","owner","author","assignee"];
var AT_KEYS   = ["at","time","when","ts","date","due"];
var ST_KEYS   = ["st","status","state","phase","level","lv"];
var COLOR_KEYS= ["hex","color","c","tint"];
var UNIT_KEYS = ["unit","u"];
var ICON_KEYS = ["e","icon","emoji","i"];

function pick(o, keys){ for(var i=0;i<keys.length;i++){ var v=o[keys[i]]; if(v!==undefined&&v!==null&&v!=="") return v; } return ""; }
function isObj(v){ return v!==null&&typeof v==="object"&&!Array.isArray(v); }
function isArr(v){ return Array.isArray(v); }
function esc(s){
  return String(s===undefined||s===null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function txt(o){ var v=pick(o,TXT_KEYS); return v===""?"":String(v); }
function val(o){ var v=pick(o,VAL_KEYS); return v===""?"":String(v); }
function sub(o){ var v=pick(o,SUB_KEYS); return v===""?"":String(v); }
function who(o){ var v=pick(o,WHO_KEYS); return v===""?"":String(v); }
function at(o){ var v=pick(o,AT_KEYS); return v===""?"":String(v); }
function stOf(o){ var v=pick(o,ST_KEYS); return v===""?"":String(v); }
function colorOf(o){ var v=pick(o,COLOR_KEYS); return (typeof v==="string"&&/^#[0-9a-f]{3,8}$/i.test(v))?v:""; }
function iconOf(o){ var v=pick(o,ICON_KEYS); return (typeof v==="string"&&v.length<=4)?v:""; }
function num(v, d){ var n=parseFloat(v); return isFinite(n)?n:(d||0); }

/* 主数组：取契约里声明的第一个数组字段，回退到常见名 */
function mainArr(dsl, comp){
  var ct = ZX_CONTRACTS[comp] || {};
  var arrs = ct.arrays || [];
  for(var i=0;i<arrs.length;i++){ if(isArr(dsl[arrs[i]])&&dsl[arrs[i]].length) return dsl[arrs[i]]; }
  for(var i=0;i<arrs.length;i++){ if(isArr(dsl[arrs[i]])) return dsl[arrs[i]]; }
  var cand=["items","rows","nodes","pts","steps","v","edges","cols","options","days","cells",
            "slots","groups","blocks","marks","stages","fields","links","opts","cards","levels",
            "series","people","columns","labels","tags","tasks","children","kids"];
  for(var j=0;j<cand.length;j++){ if(isArr(dsl[cand[j]])&&dsl[cand[j]].length) return dsl[cand[j]]; }
  return [];
}
/* 子数组：容器类组件递归用 */
function childArr(dsl){
  var cand=["children","kids","items","blocks","panels","sections","groups"];
  for(var i=0;i<cand.length;i++){ if(isArr(dsl[cand[i]])) return dsl[cand[i]]; }
  return [];
}

/* ═══════════════════════════════════════════════════════════════
   3. DOM 助手
   ═══════════════════════════════════════════════════════════════ */
function el(tag, cls, html){
  var n=document.createElement(tag);
  if(cls) n.className=cls;
  if(html!==undefined&&html!==null) n.innerHTML=html;
  return n;
}
function svg(tag, attrs){
  var n=document.createElementNS("http://www.w3.org/2000/svg", tag);
  for(var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

/* ═══════════════════════════════════════════════════════════════
   4. 布局原语（按契约编译，不是猜）
   ═══════════════════════════════════════════════════════════════ */
var LAYOUTS = {};

/* ---- 4.1 表格：columns + rows ---- */
LAYOUTS.table = function(dsl, comp, ctx){
  var cols = isArr(dsl.columns)?dsl.columns:[];
  var rows = isArr(dsl.rows)?dsl.rows:mainArr(dsl, comp);
  var box = el("div","sec"), wrap=el("div","tw"), tb=el("table","t");
  if(!cols.length && !rows.length){ box.appendChild(el("div","empty","暂无表格数据")); return box; }
  var thead=el("thead"), tr=el("tr");
  cols.forEach(function(c){
    var h = isObj(c)?txt(c):String(c);
    var th=el("th",null,esc(h)); tr.appendChild(th);
  });
  if(!cols.length && rows.length && isObj(rows[0])){
    Object.keys(rows[0]).forEach(function(k){ tr.appendChild(el("th",null,esc(k))); });
  }
  thead.appendChild(tr); tb.appendChild(thead);
  var tbody=el("tbody");
  rows.forEach(function(r, ri){
    if(!isObj(r)) return;
    var tr2=el("tr");
    var cells = cols.length?cols.map(function(c){
      var key = isObj(c)?(pick(c,["key","k","field","id"])||txt(c)):String(c);
      return r[key];
    }):Object.keys(r).map(function(k){ return r[k]; });
    cells.forEach(function(cv, ci){
      var td=el("td");
      if(typeof cv==="number") td.className="num";
      td.innerHTML = isObj(cv)?esc(txt(cv)||JSON.stringify(cv)):esc(cv===null?"—":cv);
      td.addEventListener("click", function(e){
        e.stopPropagation();
        ctx.interact("cell", {row:ri, col:ci, key:(cols[ci]&&(isObj(cols[ci])?pick(cols[ci],["key","k"])||txt(cols[ci]):String(cols[ci])))||ci, value:cv});
      });
      tr2.appendChild(td);
    });
    tr2.addEventListener("click", function(){ ctx.interact("row", {row:ri, data:r}); });
    tbody.appendChild(tr2);
  });
  tb.appendChild(tbody); wrap.appendChild(tb); box.appendChild(wrap);
  return box;
};

/* ---- 4.2 指标卡组：items[k+v] ---- */
LAYOUTS.metrics = function(dsl, comp, ctx){
  var items = mainArr(dsl, comp);
  var box=el("div","sec"), g=el("div","mgrid");
  items.forEach(function(it, i){
    if(!isObj(it)) return;
    var m=el("div","met");
    var k=txt(it)||"", v=val(it);
    if(!k) k = pick(it,["k","label","name"])||"";
    var d=sub(it), w=who(it), a=at(it);
    m.appendChild(el("div","met-k",esc(k)));
    var vv=el("div","met-v",esc(v||"—"));
    m.appendChild(vv);
    if(d) m.appendChild(el("div","met-d",esc(d)));
    var meta=[];
    if(w) meta.push(esc(w));
    if(a) meta.push(esc(a));
    if(meta.length) m.appendChild(el("div","met-d",meta.join(" · ")));
    m.addEventListener("click", function(){ ctx.interact("metric", {index:i, key:k, value:v}); });
    g.appendChild(m);
  });
  box.appendChild(g);
  return box;
};

  var items = mainArr(dsl, comp);
  var box=el("div","sec"), l=el("div","lst");
  if(!items.length) l.appendChild(el("div","empty","暂无条目"));
  items.forEach(function(it, i){
    var b=el("button","li");

    if(d) inner.appendChild(el("div","li-d",esc(d)));
    var meta=[];
    var w=who(it); if(w) meta.push(esc(w));
    var a=at(it); if(a) meta.push(esc(a));

    var c=colorOf(it);

    b.addEventListener("click", function(){ ctx.interact("item", {index:i, data:isObj(it)?it:{value:it}}); });
    l.appendChild(b);
  });
  box.appendChild(l);

};

/* ---- 4.4 步骤 / 时间线 ---- */
LAYOUTS.stepper = function(dsl, comp, ctx){
  var steps = mainArr(dsl, comp);
  var cur = dsl.cur!==undefined?num(dsl.cur,-1):-1;
  var box=el("div","sec"), l=el("div","steps");
  if(!steps.length) l.appendChild(el("div","empty","暂无步骤"));
  steps.forEach(function(s, i){
    var row=el("div","stp"+(i===cur?" cur":"")+(i<cur?" done":""));
    row.appendChild(el("div","stp-dot"));
    var b=el("div","stp-b");
    var t=isObj(s)?(txt(s)||("步骤 "+(i+1))):String(s);
    b.appendChild(el("div","stp-t",esc(t)));
    var d=isObj(s)?sub(s):"";
    if(d) b.appendChild(el("div","stp-d",esc(d)));
    var a=isObj(s)?at(s):"";
    if(a) b.appendChild(el("div","stp-m",esc(a)));
    row.appendChild(b);
    row.addEventListener("click", function(){ ctx.interact("step", {index:i, current:cur}); });
    l.appendChild(row);
  });
  box.appendChild(l);
  return box;
};

/* ---- 4.5 表单：fields + submit ---- */
LAYOUTS.form = function(dsl, comp, ctx){
  var fields = isArr(dsl.fields)?dsl.fields:mainArr(dsl, comp);
  var box=el("div","sec"), f=el("form","fm");
  f.addEventListener("submit", function(e){ e.preventDefault(); });
  fields.forEach(function(fd, i){
    if(!isObj(fd)) return;
    var id = pick(fd,["id","key","k","name"])||("f"+i);
    var kind = (pick(fd,["kind","type","t"])||"text").toLowerCase();
    var label = txt(fd)||id;
    var row=el("div","fld");
    row.appendChild(el("div","fld-l",esc(label)));
    var inp;
    if(kind==="select"||kind==="dropdown"||kind==="choice"){
      inp=el("select");
      var opts=isArr(fd.options)?fd.options:[];
      opts.forEach(function(o){
        var ov=isObj(o)?(val(o)||txt(o)):o;
        var ot=isObj(o)?(txt(o)||val(o)):o;
        var op=el("option",null,esc(ot)); op.value=String(ov); inp.appendChild(op);
      });
    } else if(kind==="textarea"||kind==="multiline"||kind==="long"){
      inp=el("textarea");
    } else if(kind==="switch"||kind==="toggle"||kind==="bool"){
      inp=el("input"); inp.type="checkbox"; inp.style.width="22px"; inp.style.height="22px"; inp.style.minHeight="0";
    } else if(kind==="slider"||kind==="range"){
      inp=el("input"); inp.type="range";
      if(fd.min!==undefined) inp.min=fd.min;
      if(fd.max!==undefined) inp.max=fd.max;
    } else if(kind==="number"){
      inp=el("input"); inp.type="number";
      if(fd.min!==undefined) inp.min=fd.min;
      if(fd.max!==undefined) inp.max=fd.max;
    } else if(kind==="date"||kind==="time"){
      inp=el("input"); inp.type=kind;
    } else {
      inp=el("input"); inp.type="text";
    }
    inp.id="fld_"+id; inp.name=id;
    if(fd.placeholder) inp.placeholder=fd.placeholder;
    if(fd.default!==undefined||fd.v!==undefined) inp.value=fd.default!==undefined?fd.default:fd.v;
    row.appendChild(inp);
    f.appendChild(row);
  });
  var submitLabel = dsl.submit||dsl.action||"提交";
  var btn=el("button","btn btn-p btn-w",esc(submitLabel));
  btn.type="submit";
  btn.addEventListener("click", function(){
    var out={};
    fields.forEach(function(fd, i){
      if(!isObj(fd)) return;
      var id = pick(fd,["id","key","k","name"])||("f"+i);
      var node=document.getElementById("fld_"+id);
      if(!node) return;
      out[id] = node.type==="checkbox"?node.checked:node.value;
    });
    ctx.interact("submit", {values:out});
  });
  f.appendChild(btn);
  box.appendChild(f);
  return box;
};

/* ---- 4.8 图表：pts / series → SVG 折线或柱状 ---- */
LAYOUTS.chart = function(dsl, comp, ctx){
  var box=el("div","sec");
  var pts = isArr(dsl.pts)?dsl.pts:(isArr(dsl.series)?dsl.series:mainArr(dsl, comp));
  var W=680,H=220,P=32;
  var s=svg("svg",{viewBox:"0 0 "+W+" "+H,class:"chart",preserveAspectRatio:"xMidYMid meet"});
  var nums = pts.map(function(p){ return isObj(p)?num(pick(p,VAL_KEYS)||p.v||p.y||0):num(p); });
  var labels = pts.map(function(p,i){ return isObj(p)?(txt(p)||pick(p,["x","label","n","t"])||""):String(i+1); });
  var mx=Math.max.apply(null,nums.concat([1])), mn=Math.min.apply(null,nums.concat([0]));
  if(mx===mn) mx=mn+1;
  var bw = (W-P*2)/Math.max(nums.length,1);
  /* 网格线 */
  for(var g=0;g<=4;g++){
    var gy=P+(H-P*2)*g/4;
    s.appendChild(svg("line",{x1:P,y1:gy,x2:W-P,y2:gy,stroke:"var(--line)","stroke-width":"1"}));
    var tv=el("text",null,esc((mx-(mx-mn)*g/4).toFixed(mx>10?0:1)));
    tv.setAttribute("x",4); tv.setAttribute("y",gy+4); tv.setAttribute("fill","var(--fg-3)");
    tv.setAttribute("font-size","10"); tv.setAttribute("font-family","var(--mono)");
    s.appendChild(tv);
  }
  var isBar = comp.indexOf("bar")>=0 || comp.indexOf("column")>=0 || comp.indexOf("hist")>=0;
  nums.forEach(function(v,i){
    var h=(v-mn)/(mx-mn)*(H-P*2);
    var x=P+bw*i+bw*0.18, w=bw*0.64, y=H-P-h;
    if(isBar){
      var r=svg("rect",{x:x,y:y,width:w,height:Math.max(h,1),rx:3,fill:"var(--accent)",opacity:0.85});
      r.style.cursor="pointer";
      r.addEventListener("click",function(){ ctx.interact("bar",{index:i,label:labels[i],value:v}); });
      s.appendChild(r);
    }
    var lb=el("text",null,esc(labels[i]));
    lb.setAttribute("x",P+bw*i+bw/2); lb.setAttribute("y",H-P+14);
    lb.setAttribute("text-anchor","middle"); lb.setAttribute("fill","var(--fg-3)");
    lb.setAttribute("font-size","10"); s.appendChild(lb);
  });
  if(!isBar && nums.length>1){
    var d="";
    nums.forEach(function(v,i){
      var x=P+bw*i+bw/2, y=H-P-(v-mn)/(mx-mn)*(H-P*2);
      d += (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);
    });
    s.appendChild(svg("path",{d:d,fill:"none",stroke:"var(--accent)","stroke-width":"2.5","stroke-linejoin":"round","stroke-linecap":"round"}));
    nums.forEach(function(v,i){
      var x=P+bw*i+bw/2, y=H-P-(v-mn)/(mx-mn)*(H-P*2);
      var c=svg("circle",{cx:x,cy:y,r:4,fill:"var(--surface)",stroke:"var(--accent)","stroke-width":"2.5"});
      c.style.cursor="pointer";
      c.addEventListener("click",function(){ ctx.interact("point",{index:i,label:labels[i],value:v}); });
      s.appendChild(c);
    });
  }
  box.appendChild(s);
  var title = txt(dsl)||dsl.title||"";
  if(title) box.appendChild(el("div","sec-t",esc(title)));
  return box;
};

/* ---- 4.9 甘特：tasks[n+s+e] ---- */
LAYOUTS.gantt = function(dsl, comp, ctx){
  var tasks = isArr(dsl.tasks)?dsl.tasks:mainArr(dsl, comp);
  var box=el("div","sec"), wrap=el("div","sec-b");
  var lo=Infinity, hi=-Infinity;
  tasks.forEach(function(t){
    var s=num(isObj(t)?(t.s!==undefined?t.s:t.from):0), e=num(isObj(t)?(t.e!==undefined?t.e:t.to):0);
    if(s<lo) lo=s; if(e>hi) hi=e;
  });
  if(!isFinite(lo)){ lo=0; hi=1; }
  if(hi<=lo) hi=lo+1;
  var W=680,ROW=34;
  var s=svg("svg",{viewBox:"0 0 "+W+" "+(ROW*tasks.length+8),class:"chart",preserveAspectRatio:"xMidYMid meet"});
  tasks.forEach(function(t,i){
    var y=i*ROW+4;
    var sv=num(isObj(t)?(t.s!==undefined?t.s:t.from):0), ev=num(isObj(t)?(t.e!==undefined?t.e:t.to):0);
    var x1=(sv-lo)/(hi-lo)*(W-150)+150, x2=(ev-lo)/(hi-lo)*(W-150)+150;
    var nm=isObj(t)?(txt(t)||("任务"+(i+1))):String(t);
    var lb=el("text",null,esc(nm.length>12?nm.slice(0,12)+"…":nm));
    lb.setAttribute("x",0); lb.setAttribute("y",y+18); lb.setAttribute("fill","var(--fg-2)"); lb.setAttribute("font-size","11.5");
    s.appendChild(lb);
    var col = colorOf(t)||"var(--accent)";
    var r=svg("rect",{x:x1,y:y+7,width:Math.max(x2-x1,3),height:16,rx:5,fill:col,opacity:0.9});
    r.style.cursor="pointer";
    r.addEventListener("click",function(){ ctx.interact("task",{index:i,name:nm,start:sv,end:ev}); });
    s.appendChild(r);
    s.appendChild(svg("line",{x1:150,y1:y+2,x2:150,y2:y+28,stroke:"var(--line)","stroke-width":"1"}));
  });
  wrap.appendChild(s); box.appendChild(wrap);
  return box;
};

/* ---- 4.12 组织 / 树：nodes 递归 ---- */
LAYOUTS.tree = function(dsl, comp, ctx){
  var nodes = isArr(dsl.nodes)?dsl.nodes:(isArr(dsl.people)?dsl.people:mainArr(dsl, comp));
  var box=el("div","sec"), wrap=el("div","tree");
  if(!nodes.length){ box.appendChild(el("div","empty","暂无节点")); return box; }
  function draw(list, depth){
    var holder=el("div");
    (list||[]).forEach(function(n, i){
      if(!isObj(n)) return;
      var row=el("div","tn");
      var tw=el("div","tn-tw", (isArr(n.children)&&n.children.length)?"▸":"");
      tw.addEventListener("click",function(e){
        e.stopPropagation();
        var sub=row.nextSibling;
        if(sub&&sub.className==="tn-k"){ sub.style.display = sub.style.display==="none"?"":"none"; tw.innerHTML = sub.style.display==="none"?"▾":"▸"; }
      });
      row.appendChild(tw);
      row.appendChild(el("div","tn-t",esc(txt(n)||val(n))));
      var s=stOf(n); if(s) row.appendChild(el("span","st st-info",esc(s)));
      row.addEventListener("click",function(){ ctx.interact("node",{depth:depth,index:i,data:n}); });
      holder.appendChild(row);
      if(isArr(n.children)&&n.children.length){
        var k=el("div","tn-k"); k.style.display="none"; k.appendChild(draw(n.children, depth+1));
        holder.appendChild(k);
      }
    });
    return holder;
  }
  wrap.appendChild(draw(nodes,0)); box.appendChild(wrap);
  return box;
};

/* ---- 4.14 终端 ---- */

/* ---- 4.16 评分 ---- */
LAYOUTS.rating = function(dsl, comp, ctx){
  var box=el("div","sec"), row=el("div","rate");
  var max=num(dsl.max,5), v=num(dsl.v||dsl.value,0);
  for(var i=1;i<=max;i++){
    var s=el("div","rate-s"+(i<=v?" on":""),"★");
    (function(idx){
      s.addEventListener("click",function(){ ctx.interact("rate",{value:idx,max:max}); });

/* ---- 4.23 数值序列：顶层数字数组 → 迷你多系列折线 ---- */
LAYOUTS.spark = function(dsl, comp, ctx){
  var box=el("div","sec"), series=[];
  Object.keys(dsl).forEach(function(k){
    if(k==="type") return;
    var v=dsl[k];
    if(isArr(v) && v.length && typeof v[0]==="number") series.push([k,v]);
  });
  if(!series.length){ box.appendChild(el("div","empty","没有数值序列")); return box; }
  var W=660,H=180,P=28,all=[];
  series.forEach(function(s){ s[1].forEach(function(x){ all.push(num(x)); }); });
  var mx=Math.max.apply(null,all.concat([1])), mn=Math.min.apply(null,all.concat([0]));
  if(mx===mn) mx=mn+1;
  var s=svg("svg",{viewBox:"0 0 "+W+" "+H,class:"chart",preserveAspectRatio:"xMidYMid meet"});
  for(var g=0;g<=3;g++){
    var gy=P+(H-P*2)*g/3;
    s.appendChild(svg("line",{x1:P,y1:gy,x2:W-P,y2:gy,stroke:"var(--line)","stroke-width":"1"}));
    var tv=el("text",null,esc((mx-(mx-mn)*g/3).toFixed(mx>10?0:1)));
    tv.setAttribute("x",2); tv.setAttribute("y",gy+4); tv.setAttribute("fill","var(--fg-3)"); tv.setAttribute("font-size","9.5");
    s.appendChild(tv);
  }
  var cols=["var(--accent)","#e8590c","#1c7ed6","#0ca678","#ae3ec9"];
  var n=series[0][1].length, bw=(W-P*2)/Math.max(n,1);
  series.forEach(function(sr,si){
    var col=cols[si%cols.length], d="", ly=0;
    sr[1].forEach(function(x,i){
      var y=H-P-(num(x)-mn)/(mx-mn)*(H-P*2);
      d+=(i?"L":"M")+(P+bw*i+bw/2).toFixed(1)+" "+y.toFixed(1); ly=y;
    });
    s.appendChild(svg("path",{d:d,fill:"none",stroke:col,"stroke-width":"2.2","stroke-linejoin":"round","stroke-linecap":"round"}));
    s.appendChild(svg("circle",{cx:P+bw*(n-1)+bw/2,cy:ly,r:3.5,fill:col}));
  });
  box.appendChild(s);
  var lg=el("div","legend");
  series.forEach(function(sr,si){
    lg.appendChild(el("span","lg-i","<i style='display:inline-block;width:9px;height:9px;border-radius:50%;background:"+cols[si%cols.length]+"'></i>"+esc(sr[0])+"（"+esc(sr[1].length)+" 点）"));
  });
  box.appendChild(lg);
  return box;
};

/* ---- 4.24 嵌套对象：递归成树 ---- */
LAYOUTS.objtree = function(dsl, comp, ctx){
  var box=el("div","sec"), wrap=el("div","tree");
  var topKeys=Object.keys(dsl).filter(function(k){ return k!=="type"; });
  if(!topKeys.length){ box.appendChild(el("div","empty","暂无结构化数据")); return box; }
  function draw(o,key){
    var holder=el("div");
    if(isArr(o)){
      o.forEach(function(v,i){ holder.appendChild(draw(v,key+"["+i+"]")); });
      return holder;
    }
    if(isObj(o)){
      var ks=Object.keys(o);
      var row=el("div","tn");
      row.appendChild(el("div","tn-tw",ks.length?"▸":""));
      row.appendChild(el("div","tn-t",esc(key)+(ks.length?"（"+ks.length+" 项）":"")));
      row.addEventListener("click",function(){ ctx.interact("node",{key:key,data:o}); });
      holder.appendChild(row);
      if(ks.length){
        var kids=el("div","tn-k"); kids.style.display="none";
        ks.forEach(function(k){ kids.appendChild(draw(o[k],k)); });
        holder.appendChild(kids);
      }
      return holder;
    }
    var leaf=el("div","tn");
    leaf.appendChild(el("div","tn-tw",""));
    leaf.appendChild(el("div","tn-t","<b>"+esc(key)+"</b> = "+esc(String(o))));
    leaf.addEventListener("click",function(){ ctx.interact("leaf",{key:key,value:o}); });
    holder.appendChild(leaf);
    return holder;
  }
  topKeys.forEach(function(k){
    var v=dsl[k];
    if(isObj(v)||isArr(v)) wrap.appendChild(draw(v,k));
    else wrap.appendChild(el("div","tn","<div class='tn-tw'></div><div class='tn-t'><b>"+esc(k)+"</b> = "+esc(String(v))+"</div>"));
  });
  box.appendChild(wrap);
  return box;
};

/* ═══════════════════════════════════════════════════════════════
   5. 布局决策： curated 优先，契约结构推断次之，generic 兜底
   ═══════════════════════════════════════════════════════════════ */
var CONTAINERS = ["zx_tabs","zx_accordion","zx_split","zx_carousel","zx_grid","zx_master","zx_stagger","zx_stack"];

/*  curated：字段结构相同但语义不同的组件，显式指定布局 */
var OVERRIDE = {
  zx_compare:"table", zx_table:"table", zx_datatable:"table", zx_matrix:"table", zx_pivot:"table",
  zx_metrics:"metrics", zx_stat:"metrics", zx_stats:"metrics", zx_kpi:"metrics", zx_counter:"metrics",
  zx_list:"list", zx_feed:"list", zx_log:"list", zx_search:"list", zx_results:"list",
  zx_timeline:"stepper", zx_steps:"stepper", zx_stepper:"stepper", zx_stages:"stepper", zx_process:"stepper",
  zx_form:"form", zx_survey:"form", zx_gridform:"form",
  zx_choice:"choice", zx_options:"choice", zx_pick:"choice", zx_vote:"choice",
  zx_tags:"chips", zx_chips:"chips", zx_labels:"chips", zx_marks:"chips",
  zx_chart:"chart", zx_line:"chart", zx_bar:"chart", zx_spark:"chart", zx_trend:"chart",
  zx_gantt:"gantt", zx_plan:"gantt",
  zx_kanban:"kanban", zx_board:"kanban",
  zx_calendar:"calendar", zx_heatmap:"calendar", zx_calheat:"calendar",
  zx_tree:"tree", zx_org:"tree", zx_orgchart:"tree", zx_mindmap:"tree", zx_depgraph:"tree",
  zx_alert:"note", zx_notice:"note", zx_callout:"note", zx_banner:"note", zx_quote:"note", zx_hint:"note",
  zx_divider:"rule", zx_stoprule:"rule",
  zx_dial:"hero", zx_dial2:"hero", zx_odometer:"hero", zx_countdown:"hero", zx_flipnum:"hero", zx_dialpad:"hero",
  zx_dial3:"gauge", zx_ring2:"tree", zx_radial:"tree", zx_sign:"keyvalue", zx_joystick:"keyvalue",
  zx_corr:"matrix", zx_missing:"matrix", zx_seat:"matrix",
  zx_sparkline:"spark", zx_bland:"spark", zx_lorenz:"spark", zx_optline:"spark", zx_perm:"spark", zx_qq:"spark",
  zx_ast:"objtree", zx_confront:"objtree", zx_formula:"objtree",
  zx_terminal:"terminal", zx_console:"terminal", zx_shell:"terminal",
  zx_diff:"diff", zx_patch:"diff", zx_changes:"diff",
  zx_rating:"rating", zx_scale:"rating", zx_stars:"rating",
  zx_gauge:"gauge", zx_progress:"gauge", zx_meter:"gauge",
  zx_media:"media", zx_image:"media", zx_video:"media", zx_audio:"media",
  zx_qr:"qr", zx_barcode:"qr",
  zx_keyvalue:"keyvalue", zx_kv:"keyvalue", zx_detail:"keyvalue", zx_summary:"keyvalue"
};

function resolveLayout(comp, dsl){
  if(OVERRIDE[comp]) return OVERRIDE[comp];
  if(CONTAINERS.indexOf(comp)>=0) return "container";
  var ct = ZX_CONTRACTS[comp]||{};
  var arrs = ct.arrays||[];
  if(arrs.indexOf("columns")>=0 && arrs.indexOf("rows")>=0) return "table";
  if(arrs.indexOf("fields")>=0) return "form";
  if(arrs.indexOf("cols")>=0 && (arrs.indexOf("cards")>=0||isArr(dsl.cols)&&isObj(dsl.cols[0])&&(isArr(dsl.cols[0].cards)||isArr(dsl.cols[0].items)))) return "kanban";
  if(arrs.indexOf("tasks")>=0) return "gantt";
  if(arrs.indexOf("options")>=0 || arrs.indexOf("opts")>=0) return "choice";
  if(arrs.indexOf("nodes")>=0 && arrs.indexOf("edges")>=0) return "tree";
  if(arrs.indexOf("nodes")>=0 || arrs.indexOf("people")>=0 || arrs.indexOf("levels")>=0) return "tree";
  if(arrs.indexOf("pts")>=0 || arrs.indexOf("series")>=0) return "chart";
  if(arrs.indexOf("steps")>=0 || arrs.indexOf("stages")>=0) return "stepper";
  if(arrs.indexOf("days")>=0 || arrs.indexOf("cells")>=0) return "calendar";
  if(arrs.indexOf("tags")>=0 || arrs.indexOf("labels")>=0 || arrs.indexOf("marks")>=0) return "chips";
  /* 契约驱动：主数组名 + 声明的标量字段组合，先于数据推断 */
  var fds = ct.fields||[];
  if(arrs.length && fds.indexOf("k")>=0 && fds.indexOf("v")>=0 &&
     ["items","rows","entries","records","list","dials","subs","metrics"].indexOf(arrs[0])>=0) return "metrics";
  if(arrs.indexOf("bins")>=0) return "chart";
  /* items 结构判定 */
  var items = mainArr(dsl, comp);
  if(items.length && isObj(items[0])){
    var keys=Object.keys(items[0]);
    if(keys.indexOf("k")>=0 && keys.indexOf("v")>=0) return "metrics";
    if(keys.indexOf("s")>=0 && keys.indexOf("e")>=0) return "gantt";
    if(keys.indexOf("id")>=0 && (keys.indexOf("kind")>=0||keys.indexOf("type")>=0)) return "form";
    if(keys.indexOf("children")>=0) return "tree";
    if(keys.indexOf("ys")>=0 || keys.indexOf("vals")>=0) return "chart";
    /* 每项 = 标签 + 单个数值数组 → 多系列折线；真正的矩阵/热图除外 */
    if(!/matrix|heat/.test(comp)){
      var ak=0, lab=false;
      for(var kj=0; kj<keys.length; kj++){
        var av=items[0][keys[kj]];
        if(isArr(av)&&av.length&&typeof av[0]==="number") ak++;
        else if(keys[kj]==="n"||keys[kj]==="t"||keys[kj]==="k"||keys[kj]==="label") lab=true;
      }
      if(ak===1 && lab) return "chart";
    }
    for(var ki=0; ki<keys.length; ki++){ if(isArr(items[0][keys[ki]]) && items[0][keys[ki]].length) return "tree"; }
    if(keys.indexOf("at")>=0 || keys.indexOf("time")>=0) return "stepper";
    if(keys.indexOf("v")>=0 && keys.indexOf("max")>=0) return "gauge";
    if(keys.indexOf("f")>=0 && keys.indexOf("t")>=0) return "gantt";
    return "list";
  }
  if(items.length && typeof items[0]==="number" &&
     (items.length>=5 || /spark|line|trend|curve|hist|lorenz|bland|qq|perm|spectrum|series/.test(comp))) return "spark";
  if(items.length && typeof items[0]!=="object") return "chips";
  /* 没有可识别的数组数据：按顶层值形态分流 */
  var hasObj=false, hasNum=false, hasMtx=false;
  Object.keys(dsl).forEach(function(k){
    if(k==="type") return;
    var v=dsl[k];
    if(isObj(v) && Object.keys(v).length) hasObj=true;
    if(isArr(v) && v.length && typeof v[0]==="number") hasNum=true;
    if(isArr(v) && v.length && isArr(v[0]) && v[0].length) hasMtx=true;
  });
  if(hasObj) return "objtree";
  if(hasMtx) return "matrix";
  if(hasNum) return "spark";
  if(Object.keys(dsl).length<=1) return "note";
  return "generic";
}

function compile(comp, dsl, ctx){
  var layout = resolveLayout(comp, dsl);
  var fn = LAYOUTS[layout];
  if(!fn){ layout="generic"; fn=LAYOUTS.generic; }
  try{ return fn(dsl, comp, ctx); }
  catch(e){
    var b=el("div","sec"); b.appendChild(el("div","err-box", esc(comp+" 渲染失败："+(e&&e.message||e))));
    return b;
  }
}

/* ═══════════════════════════════════════════════════════════════
   6. 宿主桥
   ═══════════════════════════════════════════════════════════════ */
var state={component:"",title:"",dsl:{},dark:false,raw:false};
var $t=document.getElementById("t"), $c=document.getElementById("c"),
    $body=document.getElementById("body"), $rawBtn=document.getElementById("rawBtn");

var ctx={
  interact:function(action, payload){
    var msg={action:action||"tap"};
    if(payload) for(var k in payload) msg[k]=payload[k];
    msg.component=state.component;
    msg.summary=state.component+" · "+msg.action+(payload&&payload.key?(" · "+payload.key):(payload&&payload.label?(" · "+payload.label):""));
    try{
      if(window.ZorvAIBridge && window.ZorvAIBridge.interact)
        window.ZorvAIBridge.interact(JSON.stringify(msg));
    }catch(e){}
  }
};

function render(){
  $t.textContent = state.title || state.component || "Web UI";
  $c.textContent = state.component || "";
  $body.innerHTML="";
  if(!state.component){
    $body.appendChild(el("div","empty","等待卡片数据…"));
    return;
  }
  var node = compile(state.component, state.dsl, ctx);
  if(node) $body.appendChild(node);
  if(state.raw){
    var pre=el("pre","raw");
    pre.textContent=JSON.stringify(state.dsl,null,2);
    $body.appendChild(pre);
  }
}

$rawBtn.addEventListener("click",function(){
  state.raw=!state.raw;
  $rawBtn.textContent = state.raw?"卡片":"DSL";
  render();
});

/* ── 宿主 API ── */
window.ZorvAI={
  render:function(p){
    state.component=(p&&p.component)||"";
    state.title=(p&&p.title)||state.component;
    state.dsl=(p&&p.dsl)||{};
    state.dark=!!(p&&p.dark);
    document.documentElement.classList.toggle("dark",state.dark);
    render();
  },
  setDark:function(v){
    state.dark=!!v;
    document.documentElement.classList.toggle("dark",state.dark);
  },
  patch:function(partial){
    /* 增量更新：合并进 dsl 后重编译，不重建 WebView */
    if(!partial) return;
    for(var k in partial) state.dsl[k]=partial[k];
    render();
  },
  getState:function(){ return JSON.stringify({component:state.component,title:state.title,dark:state.dark}); }
};
document.documentElement.classList.toggle("dark",state.dark);
render();
</script>
</body>
