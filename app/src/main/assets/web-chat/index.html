<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 有它才是真正的移动端布局视口；没有它 Android WebView 会按 980px 排版再缩 -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ZorvAI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════
     Web UI —— ZorvAI 对话框的**投影**
     ═══════════════════════════════════════════════════════════════════

     🔴 这个页面不是「一个网页版聊天应用」，所以它刻意**没有**自己的一套设计：
        · 没有 logo、没有空状态插画、没有自创的页脚标语；
        · 顶栏字段（标题/模型/人格）由宿主投影过来，与原生 ChatTopBar 同源；
        · 消息一律按宿主投影的**块序列**渲染（块由原生 parseBlocks 产出），
          本页不做任何 Markdown/围栏解析——一旦在这里解析，投影就退化成第二个实现；
        · 底部是原生 PermissionModeBar + 输入行的投影。

     这里只承担一件事：**把宿主投过来的东西画出来**。

     互动UI界面（zxwidget）**在本页同样画得出来**：它不是「某个对话框的私产」，
     而是一套被两个对话框一起支持的动态交互界面。本页用 iframe 引 `/zx/shell` ——
     那一页就是原生 `ZxWidgetInline` 用的**同一份** `zx_card_runtime.html`
     （同一份编译器/ CSS / 高度回报），服务端只把原生桥换成 postMessage。
     所以网页上与手机上画出来的是同一个东西，不存在「网页看得到、手机画不出」的分叉。
     交互回路也共用：界面里的操作走 POST /api/interact，
     命中在等的 zx_web_card 工具就作为**工具结果**放行，否则作为一条用户消息发出。
     ═══════════════════════════════════════════════════════════════════ -->
<div id="app">

  <!-- 顶栏 = 原生 ChatTopBar 的投影 -->
  <header id="hd">
    <div class="hd-main">
      <h1 id="title">ZorvAI</h1>
      <div class="hd-sub">
        <span id="model" class="chip"></span>
        <span id="persona" class="chip"></span>
      </div>
    </div>
    <span class="dot" id="dot"></span>
    <button id="btn-new" type="button">新对话</button>
  </header>

  <!-- 消息流 = 原生 MessageList 的投影 -->
  <main id="stream" role="log" aria-live="polite"></main>

  <!-- 底栏 = 原生 PermissionModeBar + 输入行的投影 -->
  <footer id="composer">
    <!-- 权限模式条 = 原生 ChatPermissionModeBar **收起态那一行摘要**的投影。
         顺序与文案逐项对齐原生（qk_03219 / qk_03220 / qk_03221 / qk_03069 / qk_03223
         / CMS / qk_03224 / qk_00025），一个不多一个不少：
         上一版这里写的是「自动记忆」「视觉」，而原生是「记忆」「看懂屏幕」——
         标签自己走偏也是投影失真，虽然不报错，但用户对着两边看就是两个说法。
         CMS / 特权 是原生**常驻**显示的两个标签（它们直接决定 AI 能不能动能力），
         投影少投就等于网页看到的权限状态是残缺的。
         工作区在原生只出现在展开区；本页没有展开态，故并到同一行末尾。 -->
    <div id="modes" class="modes">
      <button type="button" class="mode" data-mode="deepThink">深度思考</button>
      <button type="button" class="mode" data-mode="autoSaveMemory">记忆</button>
      <button type="button" class="mode" data-mode="subAgent">子智能体</button>
      <button type="button" class="mode" data-mode="autoRead">自动朗读</button>
      <button type="button" class="mode" data-mode="vision">看懂屏幕</button>
      <button type="button" class="mode tri" id="cms">CMS</button>
      <button type="button" class="mode tri" id="priv">特权</button>
      <button type="button" class="mode" id="ws">工作区</button>
    </div>
    <div class="crow">
      <textarea id="inp" rows="1" placeholder="发消息…" autocomplete="off"
                autocapitalize="sentences" spellcheck="false"></textarea>
      <button id="send" type="button" aria-label="发送"></button>
    </div>
    <div id="cfoot">
      <span id="cnt">0 条消息</span>
      <span class="right" id="link"></span>
    </div>
    <!-- 布局自检行：平时 hidden、不占位；只在「消息存在但渲染区高度塌成 0」时出现，
         把实测数字摊出来。上一次真机白屏时我拿不到任何数字，只能让用户重装再截图。 -->
    <div id="diag" hidden></div>
  </footer>

</div>

<script src="chat.js"></script>
</body>
</html>
