<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 有它才是真正的移动端布局视口；没有它 Android WebView 会按 980px 排版再缩 -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#C25A38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ZorvAI</title>
<!-- 品牌标识：陶土圆点 + 纸环（内联 data URI，离线可用） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23F4F1EA' stroke='%23C25A38' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23C25A38'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════
     Web UI —— ZorvAI 对话框的**对等客户端**（另一个 ZorvAI 对话框）
     布局对齐原生 ChatScreen：
       · 顶栏 = 原生 ChatTopBar：单行（左菜单 / 中人格+模型胶囊 / 右语音·设置·新对话）
       · 消息流 = 原生 MessageList 同源渲染
       · 权限条 = 原生 ChatPermissionModeBar：默认收起单行摘要，点开展开
       · 输入行 = 原生输入区
     「功能」抽屉（左菜单打开）= 全部在 Web 端真能跑的动作，不再唤起原生深链。
     ═══════════════════════════════════════════════════════════════════ -->

<div id="app">

  <!-- 顶栏 = 原生 ChatTopBar 单行对等实现 -->
  <header id="hd">
    <button id="btn-menu" class="hd-ico" type="button" aria-label="功能" title="功能">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="hd-chips">
      <button type="button" class="chip" id="persona" title="切换人格"></button>
      <span class="hd-sep" aria-hidden="true"></span>
      <button type="button" class="chip" id="model" title="切换模型"></button>
    </div>
    <div class="hd-right">
      <button id="btn-voice" class="hd-ico" type="button" aria-label="语音" title="语音">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button id="btn-settings" class="hd-ico" type="button" aria-label="设置" title="设置">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button id="btn-new" class="hd-ico" type="button" aria-label="新对话" title="新对话">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <!-- 消息流 = 原生 MessageList 的同源渲染 -->
  <main id="stream" role="log" aria-live="polite"></main>

  <!-- 底栏 = 原生 ChatPermissionModeBar（默认收起）+ 输入行 -->
  <footer id="composer">

    <!-- 权限模式条：默认收起单行摘要（对等客户端，可展开直接切换） -->
    <div id="perm" class="perm">
      <button id="permHead" class="perm-head" type="button" aria-expanded="false">
        <span class="perm-title">能力</span>
        <span class="perm-tags" id="permTags"></span>
        <span class="perm-chev" id="permChev" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </span>
      </button>
      <div id="permBody" class="perm-body" hidden>
        <div class="perm-modes" id="permModes"><!-- JS 注入 5 个开关行 --></div>
        <div class="perm-policy">
          <button type="button" class="pp" id="cms">CMS</button>
          <button type="button" class="pp" id="priv">特权</button>
        </div>
        <button type="button" class="perm-ws" id="ws">工作区</button>
      </div>
    </div>

    <!-- 输入行 -->
    <div class="crow">
      <button id="btn-attach" type="button" class="tbtn" title="上传文件" aria-label="上传文件">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <textarea id="inp" rows="1" placeholder="发消息…" autocomplete="off"
                autocapitalize="sentences" spellcheck="false"></textarea>
      <button id="send" type="button" aria-label="发送">
        <svg id="send-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        <svg id="stop-ico" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none" hidden><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </div>

    <!-- 布局自检行：平时 hidden、不占位 -->
    <div id="diag" hidden></div>
  </footer>

  <!-- 已选附件条 -->
  <div id="attbar" hidden></div>

  <!-- 轻提示 -->
  <div id="toast" class="toast" hidden></div>

  <!-- ═══ 弹层 ═══ -->

  <!-- 模型选择弹层 -->
  <div class="overlay" id="modelSheet" hidden>
    <div class="sheet">
      <div class="sheet-h">
        <span>切换模型</span>
        <button type="button" class="x" data-close="modelSheet">✕</button>
      </div>
      <div class="sheet-b" id="modelList"></div>
      <div class="sheet-f">
        <button type="button" id="btn-fetch-models">从 API 拉取可用模型</button>
        <button type="button" id="btn-add-model">添加模型</button>
      </div>
    </div>
  </div>

  <!-- 人格选择弹层 -->
  <div class="overlay" id="personaSheet" hidden>
    <div class="sheet">
      <div class="sheet-h">
        <span>切换人格</span>
        <button type="button" class="x" data-close="personaSheet">✕</button>
      </div>
      <div class="sheet-b" id="personaList"></div>
      <div class="sheet-f">
        <button type="button" id="btn-add-persona">添加人格</button>
      </div>
    </div>
  </div>

  <!-- 功能抽屉（左菜单打开，全部 Web 端真功能） -->
  <div class="overlay drawer" id="drawerSheet" hidden>
    <div class="sheet drawer-sheet">
      <div class="sheet-h">
        <span>功能</span>
        <button type="button" class="x" data-close="drawerSheet">✕</button>
      </div>
      <div class="sheet-b" id="drawerList"></div>
    </div>
  </div>

  <!-- 语音面板（Web Speech API 真功能） -->
  <div class="overlay" id="voiceSheet" hidden>
    <div class="sheet">
      <div class="sheet-h">
        <span>语音</span>
        <button type="button" class="x" data-close="voiceSheet">✕</button>
      </div>
      <div class="sheet-b">
        <div class="voice-sec">
          <div class="voice-sec-t">朗读（TTS）</div>
          <textarea id="ttsText" rows="3" class="voice-ta" placeholder="输入要朗读的文字，或点「朗读最后回复」"></textarea>
          <div class="voice-btns">
            <button type="button" class="qbtn filled" id="btn-tts-speak">朗读</button>
            <button type="button" class="qbtn" id="btn-tts-last">朗读最后回复</button>
            <button type="button" class="qbtn ghost" id="btn-tts-stop">停止</button>
          </div>
        </div>
        <div class="voice-sec">
          <div class="voice-sec-t">语音输入（STT）</div>
          <button type="button" class="qbtn" id="btn-stt">开始说话</button>
          <div class="voice-stt" id="sttStatus">点「开始说话」后对着麦克风讲话，文字会进入输入框。</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 设置弹层 -->
  <div class="overlay" id="settingsSheet" hidden>
    <div class="sheet">
      <div class="sheet-h">
        <span>设置</span>
        <button type="button" class="x" data-close="settingsSheet">✕</button>
      </div>
      <div class="sheet-b">
        <label class="set-row">
          <span>深色模式</span>
          <span class="dui-switch"><input type="checkbox" id="sw-dark" class="dui-switch-input"></span>
        </label>
        <button type="button" class="set-row link" id="btn-export">导出对话</button>
        <button type="button" class="set-row link" id="btn-clear">清空对话</button>
        <div class="set-about">
          <div class="set-about-t">ZorvAI Web 对等端</div>
          <div class="set-about-d">浏览器里的另一个 ZorvAI 对话框，与原生同源渲染、同一份状态。</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 文件选择（隐藏 input） -->
  <input type="file" id="fileInput" multiple hidden>

</div>

<script src="renderers.js"></script>
<script src="chat.js"></script>
</body>
</html>
