<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 有它才是真正的移动端布局视口；没有它 Android WebView 会按 980px 排版再缩 -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#C25A38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ZorvAI</title>
<!-- 品牌标识：陶土圆点 + 纸环（内联 data URI，离线可用） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23F4F1EA' stroke='%23C25A38' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23C25A38'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════
     Web UI —— ZorvAI 的**对等客户端**（另一个 ZorvAI 对话框）
     ═══════════════════════════════════════════════════════════════════

     这个页面不是投影，而是 ZorvAI 对话框在浏览器里的**对等客户端**：
     同一个会话、同一份状态、同一条渲染链，但这里可以像原生一样操作：
       · 发消息 / 停止 / 新对话 / 清空；
       · 深度思考 / 记忆 / 子智能体 / 自动朗读 / 看懂屏幕 开关直接切换；
       · CMS / 特权 策略直接切换；
       · 模型 / 人格选择弹层；
       · 上传图片 / 文件 / 视频；
       · 语音面板（TTS / STT）；
       · 打开全部原生功能面板（终端 / 编辑器 / 工具箱 / 知识库 / …）。

     消息渲染与原生同源：正文块由原生 parseBlocks 产出（见 WebUiProjection），
     互动UI界面（zxwidget）用 iframe 引 /zx/shell —— 与原生同一份运行时。
     ═══════════════════════════════════════════════════════════════════ -->
<div id="app">

  <!-- 顶栏 = 原生 ChatTopBar 的对等实现（模型/人格可点） -->
  <header id="hd">
    <div class="hd-main">
      <h1 id="title">ZorvAI</h1>
      <div class="hd-sub">
        <button type="button" class="chip" id="model" title="切换模型"></button>
        <button type="button" class="chip" id="persona" title="切换人格"></button>
      </div>
    </div>
    <span class="dot" id="dot"></span>
    <button id="btn-new" type="button">新对话</button>
  </header>

  <!-- 消息流 = 原生 MessageList 的同源渲染 -->
  <main id="stream" role="log" aria-live="polite"></main>

  <!-- 底栏 = 原生 PermissionModeBar + 输入行的对等实现 -->
  <footer id="composer">
    <!-- 权限模式条：可点击切换（对等客户端） -->
    <div id="modes" class="modes">
      <button type="button" class="mode" data-mode="deepThink">深度思考</button>
      <button type="button" class="mode" data-mode="autoSaveMemory">记忆</button>
      <button type="button" class="mode" data-mode="subAgent">子智能体</button>
      <button type="button" class="mode" data-mode="autoRead">自动朗读</button>
      <button type="button" class="mode" data-mode="vision">看懂屏幕</button>
      <button type="button" class="mode tri" id="cms">CMS</button>
      <button type="button" class="mode tri" id="priv">特权</button>
      <button type="button" class="mode" id="ws">工作区</button>
    </div>
    <div class="crow">
      <button id="btn-tools" type="button" class="tbtn" title="工具面板" aria-label="工具面板">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="btn-attach" type="button" class="tbtn" title="上传文件" aria-label="上传文件">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <textarea id="inp" rows="1" placeholder="发消息…" autocomplete="off"
                autocapitalize="sentences" spellcheck="false"></textarea>
      <button id="send" type="button" aria-label="发送">
        <svg id="send-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        <svg id="stop-ico" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none" hidden><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </div>
    <div id="cfoot">
      <span id="cnt">0 条消息</span>
      <span class="mid" id="btn-settings">设置</span>
      <span class="right" id="link"></span>
    </div>
    <!-- 布局自检行：平时 hidden、不占位 -->
    <div id="diag" hidden></div>
  </footer>

  <!-- 已选附件条 -->
  <div id="attbar" hidden></div>

  <!-- ═══ 弹层 ═══ -->

  <!-- 模型选择弹层 -->
  <div class="overlay" id="modelSheet" hidden>
    <div class="sheet">
      <div class="sheet-h">
        <span>切换模型</span>
        <button type="button" class="x" data-close="modelSheet">✕</button>
      </div>
      <div class="sheet-b" id="modelList"></div>
      <div class="sheet-f">
        <button type="button" id="btn-fetch-models">从 API 拉取可用模型</button>
        <button type="button" id="btn-add-model">添加模型</button>
      </div>
    </div>
  </div>

  <!-- 人格选择弹层 -->
  <div class="overlay" id="personaSheet" hidden>
    <div class="sheet">
      <div class="sheet-h">
        <span>切换人格</span>
        <button type="button" class="x" data-close="personaSheet">✕</button>
      </div>
      <div class="sheet-b" id="personaList"></div>
      <div class="sheet-f">
        <button type="button" id="btn-add-persona">添加人格</button>
      </div>
    </div>
  </div>

  <!-- 工具面板（+） -->
  <div class="overlay" id="toolSheet" hidden>
    <div class="sheet">
      <div class="sheet-h">
        <span>工具面板</span>
        <button type="button" class="x" data-close="toolSheet">✕</button>
      </div>
      <div class="sheet-b" id="toolList"></div>
    </div>
  </div>

  <!-- 语音面板 -->
  <div class="overlay" id="voiceSheet" hidden>
    <div class="sheet">
      <div class="sheet-h">
        <span>语音</span>
        <button type="button" class="x" data-close="voiceSheet">✕</button>
      </div>
      <div class="sheet-b" id="voiceList"></div>
    </div>
  </div>

  <!-- 设置弹层 -->
  <div class="overlay" id="settingsSheet" hidden>
    <div class="sheet">
      <div class="sheet-h">
        <span>设置</span>
        <button type="button" class="x" data-close="settingsSheet">✕</button>
      </div>
      <div class="sheet-b" id="settingsList"></div>
    </div>
  </div>

  <!-- 功能面板入口网格 -->
  <div class="overlay" id="featuresSheet" hidden>
    <div class="sheet">
      <div class="sheet-h">
        <span>全部功能</span>
        <button type="button" class="x" data-close="featuresSheet">✕</button>
      </div>
      <div class="sheet-b" id="featuresList"></div>
    </div>
  </div>

  <!-- 文件选择（隐藏 input） -->
  <input type="file" id="fileInput" multiple hidden>

</div>

<script src="renderers.js"></script>
<script src="chat.js"></script>
</body>
</html>
