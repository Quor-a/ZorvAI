<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>节点编辑器</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --node: #1e2330;
    --node-border: #2c3346;
    --accent: #4f8cff;
    --accent2: #f5a623;
    --text: #e6e9ef;
    --muted: #8a93a6;
    --edge: #5b6478;
    --danger: #e5484d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--text); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; width: 100%; }

  /* 顶部工具栏 */
  #toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 8px 10px; background: var(--panel);
    border-bottom: 1px solid var(--node-border);
    flex: 0 0 auto;
  }
  #toolbar .group { display: flex; gap: 6px; align-items: center; }
  #toolbar .sep { width: 1px; height: 22px; background: var(--node-border); margin: 0 4px; }
  button.tb {
    background: var(--node); color: var(--text); border: 1px solid var(--node-border);
    border-radius: 8px; padding: 7px 11px; font-size: 13px; cursor: pointer;
    line-height: 1; white-space: nowrap;
  }
  button.tb:hover { border-color: var(--accent); }
  button.tb.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.tb.run { background: #2ecc71; border-color: #2ecc71; color: #06281a; font-weight: 600; }
  button.tb.warn { border-color: var(--danger); color: var(--danger); }
  select.tb {
    background: var(--node); color: var(--text); border: 1px solid var(--node-border);
    border-radius: 8px; padding: 7px 8px; font-size: 13px; max-width: 150px;
  }

  /* 画布 */
  #stage {
    position: relative; flex: 1 1 auto; overflow: auto;
    background:
      radial-gradient(circle, #20242f 1px, transparent 1px);
    background-size: 22px 22px; background-color: var(--bg);
    touch-action: none;
  }
  #canvas { position: relative; min-width: 2000px; min-height: 1400px; }
  #edges {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 1; overflow: visible;
  }
  #edges path { stroke: var(--edge); stroke-width: 2.5; fill: none; }
  #edges path.sel { stroke: var(--danger); stroke-width: 3; }
  #edges path.temp { stroke: var(--accent); stroke-dasharray: 5 4; }
  #edges text.elabel { fill: var(--muted); font-size: 11px; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }

  .node {
    position: absolute; z-index: 2; min-width: 130px; max-width: 230px;
    background: var(--node); border: 1.5px solid var(--node-border);
    border-left-width: 5px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.35);
    cursor: grab;
  }
  .node.sel { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,140,255,.35), 0 4px 14px rgba(0,0,0,.35); }
  .node .hd {
    padding: 7px 10px; font-size: 12px; color: var(--muted);
    border-bottom: 1px solid var(--node-border); border-radius: 10px 10px 0 0;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .node .hd .tag { font-size: 10px; padding: 1px 6px; border-radius: 6px; background: #2a3142; color: var(--muted); }
  .node .body {
    padding: 10px; font-size: 13px; line-height: 1.4; color: var(--text);
    min-height: 20px; outline: none; word-break: break-word;
  }
  .node .body[contenteditable="true"] { background: #11151d; cursor: text; }
  .node.start, .node.end { border-color: #43c59e; }
  .node.start .hd .tag, .node.end .hd .tag { background: rgba(67,197,158,.18); color: #43c59e; }
  .node.end { border-color: var(--danger); }
  .node.end .hd .tag { background: rgba(229,72,77,.18); color: var(--danger); }

  .port {
    position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--accent); z-index: 3;
    top: 50%; transform: translateY(-50%);
  }
  .port.in { left: -8px; }
  .port.out { right: -8px; cursor: crosshair; border-color: var(--accent2); }
  .port.out:hover { background: var(--accent2); }

  /* 右侧属性面板 */
  #props {
    position: absolute; top: 0; right: 0; width: 290px; max-width: 88%; height: 100%;
    background: var(--panel); border-left: 1px solid var(--node-border);
    display: flex; flex-direction: column; z-index: 30;
    transform: translateX(100%); transition: transform .18s ease;
    box-shadow: -6px 0 24px rgba(0,0,0,.45);
  }
  #props.show { transform: translateX(0); }
  #props .phd {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-bottom: 1px solid var(--node-border); font-size: 13px;
  }
  #props .phd .x { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1; }
  #props .pbody { padding: 10px 12px; overflow: auto; flex: 1; }
  .fld { margin-bottom: 12px; }
  .fld > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .fld input, .fld select, .fld textarea {
    width: 100%; background: #11151d; color: var(--text); border: 1px solid var(--node-border);
    border-radius: 8px; padding: 7px 8px; font-size: 13px; font-family: inherit;
  }
  .fld textarea { min-height: 60px; resize: vertical; }
  .fld .hint { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .fld.chk { display: flex; align-items: center; gap: 8px; }
  .fld.chk > label { margin: 0; }
  .fld.chk input { width: auto; }
  .pnote { font-size: 12px; color: var(--muted); line-height: 1.5; background: #11151d; border: 1px solid var(--node-border); border-radius: 8px; padding: 8px 10px; }

  /* 连线槽位选择菜单 */
  #edgeMenu {
    position: fixed; z-index: 60; background: var(--panel); border: 1px solid var(--node-border);
    border-radius: 10px; padding: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.5); max-width: 240px;
    display: none;
  }
  #edgeMenu .et { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  #edgeMenu .opt {
    display: block; width: 100%; text-align: left; background: var(--node); color: var(--text);
    border: 1px solid var(--node-border); border-radius: 8px; padding: 7px 10px; font-size: 13px;
    margin-bottom: 5px; cursor: pointer;
  }
  #edgeMenu .opt:hover { border-color: var(--accent); }
  #edgeMenu .opt.err { border-color: var(--danger); color: var(--danger); }
  #edgeMenu input.case {
    width: 100%; background: #11151d; color: var(--text); border: 1px solid var(--node-border);
    border-radius: 8px; padding: 6px 8px; font-size: 13px; margin-bottom: 5px;
  }

  /* 底部 Mermaid 面板 */
  #bottom {
    flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--node-border);
    display: flex; flex-direction: column; max-height: 38%;
  }
  #bottom .tabbar { display: flex; gap: 4px; padding: 6px 8px 0; }
  #bottom .tab {
    padding: 6px 12px; font-size: 12px; color: var(--muted); cursor: pointer;
    border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0;
  }
  #bottom .tab.active { color: var(--text); background: var(--bg); border-color: var(--node-border); }
  #bottom .pane { display: none; padding: 8px; gap: 8px; flex: 1; min-height: 0; }
  #bottom .pane.active { display: flex; }
  #mermaidSrc {
    flex: 1; width: 100%; resize: none; background: #11151d; color: var(--text);
    border: 1px solid var(--node-border); border-radius: 8px; padding: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5;
  }
  #previewWrap { flex: 1; overflow: auto; background: #fff; border-radius: 8px; padding: 8px; }
  #previewWrap .err { color: #e5484d; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
  #previewWrap svg { max-width: 100%; height: auto; display: block; }
  .hint { font-size: 11px; color: var(--muted); padding: 2px 4px; }

  #toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: rgba(0,0,0,.82); color: #fff; padding: 8px 14px; border-radius: 10px;
    font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 99;
  }
  #toast.show { opacity: 1; }
</style>
<script src="mermaid.min.js"></script>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div class="group">
      <select id="nodeType" class="tb"></select>
      <button class="tb primary" id="addBtn">+ 添加节点</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button class="tb run" id="runBtn">▶ 运行</button>
      <button class="tb" id="copyWfBtn">复制工作流</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button class="tb" id="exportBtn">导出 Mermaid</button>
      <button class="tb" id="importBtn">从文本导入</button>
      <button class="tb" id="previewBtn">刷新预览</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button class="tb" id="copyBtn">复制 Mermaid</button>
      <button class="tb" id="saveBtn">保存工作流</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button class="tb" id="sampleBtn">加载示例</button>
      <button class="tb warn" id="delBtn">删除选中</button>
      <button class="tb warn" id="clearBtn">清空</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button class="tb" id="undoBtn">↶ 撤销</button>
      <button class="tb" id="redoBtn">↷ 重做</button>
      <button class="tb" id="saveProjBtn">保存工程</button>
      <button class="tb" id="loadProjBtn">打开工程</button>
      <button class="tb" id="pngBtn">导出 PNG</button>
    </div>
  </div>

  <div id="stage">
    <div id="canvas">
      <svg id="edges"></svg>
    </div>
  </div>

  <div id="bottom">
    <div class="tabbar">
      <div class="tab active" data-pane="src">Mermaid 源码</div>
      <div class="tab" data-pane="prev">预览</div>
    </div>
    <div class="pane active" id="pane-src">
      <textarea id="mermaidSrc" spellcheck="false" placeholder="点击「导出 Mermaid」生成，或在此粘贴 flowchart 语法后「从文本导入」"></textarea>
    </div>
    <div class="pane" id="pane-prev">
      <div id="previewWrap"><div class="hint">点「刷新预览」渲染当前 Mermaid 源码</div></div>
    </div>
  </div>

  <!-- 右侧属性面板 -->
  <div id="props">
    <div class="phd"><span id="propTitle">属性</span><button class="x" id="propClose">✕</button></div>
    <div class="pbody" id="propBody"></div>
  </div>

  <!-- 连线槽位菜单 -->
  <div id="edgeMenu">
    <div class="et" id="edgeMenuTitle"></div>
    <div id="edgeMenuOpts"></div>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="projFile" accept=".qne,application/json,.json" style="display:none">

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('canvas');
  var stage = document.getElementById('stage');
  var edgesSvg = document.getElementById('edges');
  var typeSel = document.getElementById('nodeType');
  var srcArea = document.getElementById('mermaidSrc');
  var previewWrap = document.getElementById('previewWrap');
  var toastEl = document.getElementById('toast');

  var nodes = [];   // {id, type, x, y, label, params:{}, onError}
  var edges = [];   // {id, from, to, slot}
  var seq = 1;
  var selectedNode = null;
  var selectedEdge = null;
  var flowName = 'default';

  // ── 节点类型定义（15 个真实节点 + start/end 可视化标记）──
  var TYPE_LIST = [
    { v: 'start', t: '开始（入口）' },
    { v: 'end', t: '结束（出口）' },
    { v: 'http', t: 'HTTP 请求' },
    { v: 'note', t: '备注' },
    { v: 'wait', t: '延时等待' },
    { v: 'open_app', t: '启动应用' },
    { v: 'broadcast', t: '发送广播' },
    { v: 'notify', t: '本地通知' },
    { v: 'file', t: '文件读写' },
    { v: 'condition', t: '条件分支' },
    { v: 'switch', t: '多路分支' },
    { v: 'loop', t: '循环' },
    { v: 'parallel', t: '并行扇出' },
    { v: 'open_media', t: '打开媒体' },
    { v: 'play_media', t: '播放媒体' },
    { v: 'capture_photo', t: '拍照' },
    { v: 'ai', t: 'AI 推理' },
    { v: 'extract', t: '数据抽取' },
    { v: 'exec', t: '通用执行' }
  ];
  var TYPE_LABEL = {};
  TYPE_LIST.forEach(function (o) { TYPE_LABEL[o.v] = o.t; });
  var TYPE_COLOR = {
    http: '#4f8cff', note: '#8a93a6', wait: '#f5a623', open_app: '#43c59e', broadcast: '#b388ff',
    notify: '#ff7eb6', file: '#5bc0eb', condition: '#f5a623', switch: '#f5a623', loop: '#f5a623',
    parallel: '#43c59e', open_media: '#5bc0eb', play_media: '#5bc0eb', capture_photo: '#5bc0eb',
    ai: '#4f8cff', start: '#43c59e', end: '#e5484d',
    extract: '#9b59b6', exec: '#e67e22'
  };

  // ── 每种节点的参数表单 schema ──
  var NODE_SCHEMA = {
    http: { fields: [
      { key: 'url', label: 'URL', type: 'text', ph: 'https://api.example.com/x', req: true },
      { key: 'method', label: '方法', type: 'select', opts: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE'], def: 'GET' },
      { key: 'headers', label: '请求头 (JSON)', type: 'textarea', def: '{}' },
      { key: 'body', label: '请求体', type: 'textarea' },
      { key: 'out', label: '响应存入变量', type: 'text', ph: 'resp' }
    ] },
    note: { fields: [ { key: 'text', label: '备注内容', type: 'textarea', req: true } ] },
    wait: { fields: [ { key: 'ms', label: '延时 (毫秒)', type: 'number', def: '1000' } ] },
    open_app: { fields: [ { key: 'package', label: '应用包名', type: 'text', ph: 'com.android.chrome', req: true } ] },
    broadcast: { fields: [
      { key: 'action', label: '广播 Action', type: 'text', ph: 'com.example.ACTION', req: true },
      { key: 'extras', label: '附加数据 (JSON)', type: 'textarea' },
      { key: 'ordered', label: '有序广播', type: 'checkbox', def: false }
    ] },
    notify: { fields: [
      { key: 'title', label: '标题', type: 'text', def: '工作流通知' },
      { key: 'body', label: '内容', type: 'text' }
    ] },
    file: { fields: [
      { key: 'path', label: '文件路径', type: 'text', req: true },
      { key: 'mode', label: '模式', type: 'select', opts: ['read', 'write', 'append'], def: 'read' },
      { key: 'content', label: '写入内容', type: 'textarea' },
      { key: 'out', label: '读取结果存入变量', type: 'text' }
    ] },
    condition: { fields: [ { key: 'expr', label: '条件表达式', type: 'text', ph: 'resp != "" && n > 1', req: true, hint: '支持变量与比较/逻辑运算，如 a > 1 && b == "ok"' } ],
      note: '从本节点拉出两条线，分别设为「是 / 否」分支。' },
    switch: { fields: [ { key: 'value', label: '取值表达式', type: 'text', ph: '${type} 或字面量', req: true, hint: '按取值匹配出边标签；未命中走「默认分支」' } ],
      note: '从本节点拉出多条线，每条线输入一个取值标签（如 case_a），或设为「默认分支 / 失败跳转」。' },
    loop: { fields: [
      { key: 'mode', label: '循环模式', type: 'select', opts: ['count', 'while'], def: 'count' },
      { key: 'count', label: '次数 (count)', type: 'number', def: '3', showIf: { key: 'mode', val: 'count' } },
      { key: 'while', label: '条件 (while)', type: 'text', ph: 'i < 10', showIf: { key: 'mode', val: 'while' } }
    ], note: '拉出两条线，分别设为「循环体 / 退出」。' },
    parallel: { fields: [], note: '本节点的所有出边将并发执行（扇出子节点）。' },
    open_media: { fields: [ { key: 'target', label: '媒体地址 (URL 或本地路径)', type: 'text', req: true } ] },
    play_media: { fields: [ { key: 'target', label: '媒体地址 (URL 或本地路径)', type: 'text', req: true } ] },
    capture_photo: { fields: [ { key: 'path', label: '保存路径', type: 'text', ph: 'Pictures/shot.jpg' } ] },
    ai: { fields: [
      { key: 'prompt', label: '提示词', type: 'textarea', req: true },
      { key: 'system', label: '系统提示', type: 'textarea' },
      { key: 'temperature', label: '温度', type: 'number', def: '0.7' },
      { key: 'maxTokens', label: '最大 Token', type: 'number', def: '1024' },
      { key: 'out', label: '回复存入变量', type: 'text', ph: 'ai_out' }
    ], note: 'AI 节点需要先在「设置」配置模型 API Key。' },
    extract: { fields: [
      { key: 'op', label: '抽取方式', type: 'select', opts: ['regex', 'json', 'substring', 'concat', 'random'], def: 'regex', req: true },
      { key: 'text', label: '源文本', type: 'textarea', hint: 'regex / json / substring 的源文本' },
      { key: 'pattern', label: '正则 (regex)', type: 'text', ph: '(\\d+)', showIf: { key: 'op', val: 'regex' } },
      { key: 'group', label: '捕获组 (regex)', type: 'number', def: '0', showIf: { key: 'op', val: 'regex' } },
      { key: 'global', label: '匹配全部 (regex)', type: 'checkbox', def: false, showIf: { key: 'op', val: 'regex' } },
      { key: 'path', label: 'JSON 路径 (json)', type: 'text', ph: 'a.b.0.c', showIf: { key: 'op', val: 'json' } },
      { key: 'start', label: '起始 (substring)', type: 'number', def: '0', showIf: { key: 'op', val: 'substring' } },
      { key: 'len', label: '长度 (substring)', type: 'number', def: '0', showIf: { key: 'op', val: 'substring' } },
      { key: 'parts', label: '片段 (concat, | 分隔)', type: 'text', showIf: { key: 'op', val: 'concat' } },
      { key: 'sep', label: '分隔符 (concat)', type: 'text', def: '', showIf: { key: 'op', val: 'concat' } },
      { key: 'min', label: '下限 (random)', type: 'number', def: '0', showIf: { key: 'op', val: 'random' } },
      { key: 'max', label: '上限 (random)', type: 'number', def: '1000', showIf: { key: 'op', val: 'random' } },
      { key: 'out', label: '结果存入变量', type: 'text', req: true, ph: 'data' }
    ], note: '从文本 / JSON 中抽取值或生成随机量，写入 out 变量供后续节点（如 HTTP body / 条件）消费。' },
    exec: { fields: [
      { key: 'mode', label: '执行方式', type: 'select', opts: ['js', 'tool'], def: 'js', req: true },
      { key: 'code', label: 'JS 代码 (js)', type: 'textarea', hint: 'console.log 输出即结果；走设备端 QuickJS 沙箱', showIf: { key: 'mode', val: 'js' } },
      { key: 'tool', label: '工具名 (tool)', type: 'text', ph: 'http_request', showIf: { key: 'mode', val: 'tool' } },
      { key: 'args', label: '工具参数 JSON (tool)', type: 'textarea', def: '{}', showIf: { key: 'mode', val: 'tool' } },
      { key: 'out', label: '结果存入变量', type: 'text', ph: 'result' }
    ], note: '通用执行：js=端侧 QuickJS 沙箱跑 JS（console.log 输出即结果）；tool=调用已注册 AI 工具（如 http_request）。结果写入 out 变量。' },
    start: { fields: [], note: '入口标记：连出的线指向第一个真实节点。' },
    end: { fields: [], note: '结束标记：连入的线代表流程在此终止。' }
  };

  function uid(p) { return p + (seq++); }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
  }

  function mk(type, x, y, label, params) {
    return { id: uid('n'), type: type, x: x, y: y, label: label, params: params || {} };
  }
  function addEdge(a, b, slot) { edges.push({ id: uid('e'), from: a.id, to: b.id, slot: slot || 'next' }); }

  // ---------- 历史 / 持久化 / 导出 ----------
  var history = [];
  var hidx = -1;
  function snapshot() { return JSON.stringify({ nodes: nodes, edges: edges, seq: seq, name: flowName }); }
  function pushHistory() {
    history = history.slice(0, hidx + 1);
    history.push(snapshot());
    hidx = history.length - 1;
    if (history.length > 120) { history.shift(); hidx--; }
  }
  function restore(s) {
    try {
      var o = JSON.parse(s);
      nodes = o.nodes || []; edges = o.edges || [];
      nodes.forEach(function (n) {
        n.x = (typeof n.x === 'number' && !isNaN(n.x)) ? n.x : (parseFloat(n.x) || 0);
        n.y = (typeof n.y === 'number' && !isNaN(n.y)) ? n.y : (parseFloat(n.y) || 0);
        n.params = n.params || {};
      });

  function edgeSlotLabel(slot) {

  // ---------- 构建 Workflow JSON（供引擎执行）----------
  function buildWorkflow() {
    var realNodes = nodes.filter(function (n) { return n.type !== 'start' && n.type !== 'end'; });
    if (!realNodes.length) return null;
    var outEdges = {};
    edges.forEach(function (e) { (outEdges[e.from] = outEdges[e.from] || []).push(e); });
    var wfNodes = realNodes.map(function (n) {
      var ne = outEdges[n.id] || [];
      var params = n.params || {};
      var next = null, onError = null, branches = {}, children = [];
      if (n.type === 'parallel') {
        ne.forEach(function (e) { if (e.to !== n.id) children.push(e.to); });
      } else {
        ne.forEach(function (e) {
          if (e.to === n.id) return;
          var slot = e.slot || 'next';
          if (slot === 'error') onError = e.to;
          else if (n.type === 'condition') { if (slot === 'true' || slot === 'false') branches[slot] = e.to; else if (slot === 'next') next = e.to; }
          else if (n.type === 'loop') { if (slot === 'body' || slot === 'exit') branches[slot] = e.to; else if (slot === 'next') next = e.to; }
          else if (n.type === 'switch') { if (slot && slot !== 'next' && slot !== 'error') branches[slot] = e.to; else if (slot === 'next') next = e.to; }
          else next = e.to;
        });
      }
      var o = { id: n.id, type: n.type };
      Object.keys(params).forEach(function (k) { if (params[k] !== '' && params[k] != null) o[k] = params[k]; });
      if (next) o.next = next;
      if (onError) o.onError = onError;
      if (n.type === 'condition' || n.type === 'switch' || n.type === 'loop') {
        if (Object.keys(branches).length) o.branches = branches;
      }
      if (n.type === 'parallel' && children.length) o.children = children;
      return o;
    });
    var startId = '';
    var startMarker = nodes.find(function (n) { return n.type === 'start'; });
    if (startMarker) {
      var se = outEdges[startMarker.id];
      if (se && se.length) startId = se[0].to;
    }
    if (!startId) startId = realNodes[0].id;
    return {
      id: 'wf_' + (flowName || 'default'),
      name: (flowName || 'default'),
      trigger: 'manual', schedule: '', enabled: true,
      variables: [], start: startId, nodes: wfNodes
    };
  }

  function runWorkflow() {
    var wf = buildWorkflow();
    if (!wf) { toast('画布没有可运行的节点'); return; }
    try {
      if (window.AndroidBridge && AndroidBridge.runWorkflow) {
        AndroidBridge.runWorkflow(JSON.stringify(wf));
        toast('已提交运行，请在手机通知查看结果');
      } else {
        toast('当前环境不支持运行（需 App 内打开）');
      }
    } catch (e) { toast('运行失败：' + (e.message || e)); }
  }

  // ---------- Mermaid 导入导出 ----------
  function sanitizeId(id) { return id.replace(/[^A-Za-z0-9_]/g, '_'); }
  function exportMermaid() {
    if (!nodes.length) { toast('画布为空'); return ''; }
    var lines = ['flowchart TD'];
    var shape = { process: '[]', io: '[]', start: '([])', end: '([])', decision: '{}' };
    nodes.forEach(function (n) {
      var id = sanitizeId(n.id);
      var lbl = (n.label || TYPE_LABEL[n.type]).replace(/"/g, "'");
      lines.push('  ' + id + (shape[n.type] || '[]') + '["' + lbl + '"]');
    });
    edges.forEach(function (e) {
      lines.push('  ' + sanitizeId(e.from) + ' --> ' + sanitizeId(e.to));
    });
    var txt = lines.join('\n');
    srcArea.value = txt;
    return txt;
  }
  function importMermaid(text) {
    text = (text || srcArea.value).trim();
    if (!text) { toast('没有可导入的文本'); return; }
    var lines = text.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    if (!lines.length) return;
    var defs = {}, newEdges = [];
    var reDef = /^([A-Za-z0-9_]+)\s*(?:\[([^\]]*)\]|\(([^)]*)\)|\{([^}]*)\}|\[\(([^)]*)\)\]|\(\[([^\]]*)\]\))?/;
    var reEdge = /^([A-Za-z0-9_]+)\s*-+->\s*(?:\|([^|]*)\|\s*)?([A-Za-z0-9_]+)/;
    var order = [];
    lines.forEach(function (line) {
      if (/^(flowchart|graph)\b/i.test(line)) return;
      var em = line.match(reEdge);
      if (em) { newEdges.push({ from: em[1], to: em[3] }); return; }
      var dm = line.match(reDef);
      if (dm && dm[1]) {
        var lbl = dm[2] || dm[3] || dm[4] || dm[5] || dm[6] || dm[1];
        defs[dm[1]] = lbl; order.push(dm[1]);
      }
    });
    if (!order.length) { toast('未解析到节点'); return; }
    var maxSeq = 0;
    nodes.forEach(function (n) { var mm = /(\d+)$/.exec(n.id || ''); if (mm) { var v = parseInt(mm[1], 10); if (v > maxSeq) maxSeq = v; } });
    nodes = []; edges = []; selectedNode = null; selectedEdge = null; seq = maxSeq + 1;
    var map = {};
    var cols = Math.ceil(Math.sqrt(order.length));
    order.forEach(function (oid, i) {
      var type = /[?？]/.test(defs[oid]) ? 'condition' : 'http';
      var n = mk(type, 60 + (i % cols) * 230, 60 + Math.floor(i / cols) * 130, defs[oid]);
      map[oid] = n.id; nodes.push(n);
    });
    newEdges.forEach(function (e) {
      if (map[e.from] && map[e.to]) addEdge({ id: map[e.from] }, { id: map[e.to] }, 'next');
    });
    renderAll();
    exportMermaid();
    toast('已导入 ' + nodes.length + ' 个节点（仅还原形状，参数请手动补）');
    commit();
  }

  // ---------- 预览 ----------
  function renderPreview() {
    var txt = srcArea.value.trim();
    if (!txt) { previewWrap.innerHTML = '<div class="hint">暂无源码</div>'; return; }
    try {
      if (typeof mermaid === 'undefined') { previewWrap.innerHTML = '<div class="err">mermaid.min.js 未加载</div>'; return; }
      mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose', flowchart: { useMaxWidth: true } });
      var id = 'p' + Date.now();
      mermaid.render(id, txt).then(function (r) {
        previewWrap.innerHTML = (r && r.svg) ? r.svg : ('' + r);
      }).catch(function (err) {
        previewWrap.innerHTML = '<div class="err">预览失败：\n' + (err && err.message ? err.message : err) + '</div>';
      });
    } catch (e) {
      previewWrap.innerHTML = '<div class="err">预览失败：' + (e.message || e) + '</div>';
    }
  }

  // ---------- Android 桥 ----------
  function androidCopy(text) {
    try { if (window.AndroidBridge && AndroidBridge.copyText) { AndroidBridge.copyText(text); return true; } } catch (_) {}
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text); return true; } } catch (_) {}
    return false;
  }
  function androidSave(filename, content) {
    try { if (window.AndroidBridge && AndroidBridge.saveFile) { AndroidBridge.saveFile(filename, content); return true; } } catch (_) {}
    return false;
  }

  // ---------- 按钮绑定 ----------
  document.getElementById('addBtn').addEventListener('click', function () { addNode(typeSel.value); });
  document.getElementById('runBtn').addEventListener('click', runWorkflow);
  document.getElementById('copyWfBtn').addEventListener('click', function () {
    var wf = buildWorkflow();
    if (!wf) { toast('画布没有可运行的节点'); return; }
    var txt = JSON.stringify(wf, null, 2);
    if (androidCopy(txt)) toast('已复制工作流 JSON'); else { srcArea.value = txt; srcArea.select(); toast('请手动复制'); }
  });
  document.getElementById('exportBtn').addEventListener('click', function () { var t = exportMermaid(); toast(t ? '已生成 Mermaid 源码' : '画布为空'); });
  document.getElementById('importBtn').addEventListener('click', function () { importMermaid(); });
  document.getElementById('previewBtn').addEventListener('click', renderPreview);
  document.getElementById('copyBtn').addEventListener('click', function () {
    var t = srcArea.value || exportMermaid();
    if (!t) return;
    if (androidCopy(t)) toast('已复制到剪贴板'); else { srcArea.select(); toast('请手动复制（Ctrl+C）'); }
  });
  document.getElementById('saveBtn').addEventListener('click', function () {
    var wf = buildWorkflow();
    if (!wf) { toast('画布没有可运行的节点'); return; }
    var name = 'workflow-' + (flowName || 'default') + '.json';
    if (androidSave(name, JSON.stringify(wf, null, 2))) toast('已保存工作流：' + name);
    else { srcArea.value = JSON.stringify(wf, null, 2); toast('当前环境不支持保存文件'); }
  });
  document.getElementById('delBtn').addEventListener('click', deleteSelected);
  document.getElementById('clearBtn').addEventListener('click', clearAll);
  document.getElementById('sampleBtn').addEventListener('click', function () { seedExample(); pushHistory(); autosave(); toast('已加载内置示例'); });
  document.getElementById('propClose').addEventListener('click', function () { propsEl.classList.remove('show'); });

  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('redoBtn').addEventListener('click', redo);
  document.getElementById('saveProjBtn').addEventListener('click', function () {
    var ok = androidSave('project.qne', snapshot());
    autosave();
    toast(ok ? '已保存工程文件' : '已存到本地缓存');
  });
  document.getElementById('loadProjBtn').addEventListener('click', function () {
    var inp = document.getElementById('projFile');
    if (inp) inp.click(); else toast('当前环境不支持打开文件');
  });
  document.getElementById('pngBtn').addEventListener('click', exportPNG);
  document.getElementById('projFile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        restore('' + reader.result); pushHistory(); autosave();
        exportMermaid(); renderPreview();
        toast('已打开工程：' + f.name);
      } catch (_) { toast('工程文件解析失败'); }
    };
    reader.readAsText(f);
    e.target.value = '';
  });

  // 底部 tab 切换
  Array.prototype.slice.call(document.querySelectorAll('#bottom .tab')).forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('#bottom .tab').forEach(function (x) { x.classList.remove('active'); });
      document.querySelectorAll('#bottom .pane').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      document.getElementById('pane-' + t.dataset.pane).classList.add('active');
      if (t.dataset.pane === 'prev') renderPreview();
    });
  });

  stage.addEventListener('pointerdown', function (e) {
    if (e.target === stage || e.target === canvas || e.target === edgesSvg) clearSelect();
  });
  window.addEventListener('keydown', function (e) {
    if ((e.key === 'Delete' || e.key === 'Backspace')) {
      var ae = document.activeElement;
      if (ae && ae.getAttribute && ae.getAttribute('contenteditable') === 'true') return;
      if (srcArea === document.activeElement) return;
      if (propsEl.contains(ae)) return;
      e.preventDefault(); deleteSelected();
    }
  });

  // 暴露给 Kotlin 侧调用
  window.__getMermaid = function () { return exportMermaid(); };
  window.__setMermaid = function (txt) { srcArea.value = txt || ''; importMermaid(); };
  window.__addNode = function (type) { addNode(type || 'http'); };
  window.__clear = function () { clearAll(); };
  window.__snapshot = function () { return snapshot(); };
  window.__restore = function (txt) {
    try { restore(txt); pushHistory(); autosave(); renderPreview(); return true; } catch (_) { return false; }
  };
  window.__setFlowName = function (name) { flowName = name || 'default'; };
  window.__getFlowName = function () { return flowName; };
  window.__exportWorkflow = function () { return JSON.stringify(buildWorkflow()); };

  // 内置示例：HTTP → 条件 → 是:通知 / 否:备注
  function seedExample() {
    nodes = []; edges = []; selectedNode = null; selectedEdge = null; seq = 1;
    var s = mk('start', 60, 60, '开始', {});
    var h = mk('http', 60, 190, '请求天气', { url: 'https://api.example.com/weather', method: 'GET', out: 'resp' });
    var c = mk('condition', 60, 340, '有数据?', { expr: 'resp != ""' });
    var n = mk('notify', 420, 300, '提醒', { title: '工作流', body: '天气：${resp}' });
    var note = mk('note', 420, 460, '记录', { text: '本次无数据' });
    nodes.push(s, h, c, n, note);
    addEdge(s, h, 'next'); addEdge(h, c, 'next'); addEdge(c, n, 'true'); addEdge(c, note, 'false');
    renderAll(); openProps(null);
    exportMermaid(); renderPreview();
  }

  // 初始化下拉框
  TYPE_LIST.forEach(function (o) {
    var opt = document.createElement('option');
    opt.value = o.v; opt.textContent = o.t;
    typeSel.appendChild(opt);
  });

  var restored = false;
  try { restored = loadLocal(); } catch (_) {}
  if (restored) { exportMermaid(); renderPreview(); }
  else { seedExample(); pushHistory(); autosave(); }

  try { if (window.AndroidBridge && AndroidBridge.onReady) AndroidBridge.onReady(); } catch (_) {}
})();
</script>
</body>
</html>
