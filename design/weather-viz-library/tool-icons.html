<style>
  :root{
    --bg:#0f1115;--panel:#171a21;--ink:#e8ecf3;--muted:#9aa4b2;
    --line:#262b35;--accent:#6ea8fe;--radius:14px;--shadow:0 8px 24px rgba(0,0,0,.3);
    font-synthesis:none;
  }
  @media(prefers-color-scheme:light){
    :root{--bg:#eef1f6;--panel:#fff;--ink:#1a1f29;--muted:#5b6472;--line:#e2e7ef;--shadow:0 8px 24px rgba(20,30,60,.1);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  header.top{padding:40px 24px 20px;max-width:1240px;margin:0 auto}
  header.top h1{font-size:28px;margin:0 0 6px}
  header.top p{color:var(--muted);margin:6px 0;line-height:1.55;max-width:720px}
  .pill{display:inline-block;background:var(--panel);border:1px solid var(--line);
    color:var(--muted);padding:3px 11px;border-radius:999px;font-size:12px;margin-right:6px}
  section{max-width:1240px;margin:0 auto;padding:6px 24px 36px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:1px solid var(--line);padding:16px 0 8px;margin-bottom:14px}
  .sec-head h2{font-size:18px;margin:0}
  .sec-head span{color:var(--muted);font-size:12px}

  /* ── chip grid ── */
  .grid{display:grid;gap:10px;
    grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
  .chip{
    display:flex;align-items:center;gap:7px;
    background:var(--panel);border:1px solid var(--line);
    padding:7px 10px;border-radius:10px;cursor:pointer;
    transition:transform .15s ease,border-color .15s,box-shadow .15s;
    user-select:none
  }
  .chip:hover{transform:translateY(-1px);border-color:var(--accent);box-shadow:var(--shadow)}
  .chip:active{transform:scale(.97)}
  .chip .ico{width:22px;height:22px;border-radius:6px;display:flex;
    align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
  .chip .lbl{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip .sub{font-size:9.5px;color:var(--muted);margin-left:auto;flex-shrink:0}

  /* ── category row label ── */
  .cat-label{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--accent);
    padding:10px 0 4px;border-top:1px dashed var(--line);margin-top:4px;
    letter-spacing:.5px}
  .cat-label:first-child{border-top:none;margin-top:0}

  /* ── color tokens per category ── */
  .bg-file{background:#7c3aed18;color:#a78bfa}
  .bg-web{background:#05966918;color:#34d399}
  .bg-term{background:#d9770618;color:#fbbf24}
  .bg-code{background:#0891b218;color:#22d3ee}
  .bg-ai{background:#db277718;color:#f472b6}
  .bg-media{background:#c026d318;color:#e879f9}
  .bg-ui{background:#4f46e518;color:#818cf8}
  .bg-sys{background:#ea580c18;color:#fb923c}
  .bg-com{background:#16a34a18;color:#4ade80}
  .bg-data{background:#0284c718;color:#38bdf8}
  .bg-sec{background:#dc262618;color:#f87171}
  .bg-time{background:#ca8a0418;color:#facc15}
  .bg-loc{background:#65a30d18;color:#a3e635}
  .bg-wx{background:#0369a118;color:#7dd3fc}
  .bg-mus{background:#be185d18;color:#f9a8d4}
  .bg-dev{background:#47556918;color:#94a3b8}
  .bg-cms{background:#86198f18;color:#c084fc}
  .bg-bot{background:#0d948818;color:#5eead4}
  .bg-mem{background:#1d4ed818;color:#93c5fd}
  .bg-viz{background:#b4530918;color:#fdba74}
  .bg-health{background:#15803d18颜色:#86efac}

  footer{max-width:1240px;margin:0 auto;padding:30px 24px;
    border-top:1px solid var(--line);color:var(--muted);font-size:12px}
</style>
</head>

// ─── RENDER ────────────────────────────
const app = document.getElementById('app');
let html = '';
let curCat = null;

tools.forEach((t, idx) => {
  if (t.c !== curCat) {
    curCat = t.c;
    const cat = cats.find(c => c.id === curCat);
    html += `<div class="cat-label">${cat ? cat.label : curCat}</div>`;
  }
  html += `<div class="chip"><span class="ico ${cats.find(c=>c.id===t.c)?.cls||''}">${t.i}</span><span class="lbl">${t.n}</span><span class="sub">${t.s}</span></div>`;
});

html += `<div class="cat-label" style="border-style:dashed">✅ 共 ${tools.length} 款工具调用图标</div>`;
app.innerHTML = `<div class="grid">${html}</div>`;
