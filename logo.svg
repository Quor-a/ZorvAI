<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="QuroAI logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06243C"/>
      <stop offset="0.55" stop-color="#0E6FA8"/>
      <stop offset="1" stop-color="#16C9C9"/>
    </linearGradient>
    <linearGradient id="qStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6FBFF"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <!-- 神经网络意象：内部节点星座（暗示 Agent / 多通道） -->
  <g stroke="#9BF3E8" stroke-opacity="0.45" stroke-width="3" fill="none">
    <path d="M200 175 L300 165 L330 235 L255 285 L185 240 Z"/>
    <path d="M200 175 L255 285"/>
    <path d="M300 165 L255 285"/>
  </g>
  <g fill="#A5F3FC" filter="url(#soft)">
    <circle cx="200" cy="175" r="11"/>
    <circle cx="300" cy="165" r="11"/>
    <circle cx="330" cy="235" r="11"/>
    <circle cx="255" cy="285" r="13"/>
    <circle cx="185" cy="240" r="11"/>
  </g>

  <!-- 中心抽象「Q」 -->
  <circle cx="256" cy="236" r="150" fill="none" stroke="url(#qStroke)" stroke-width="30" stroke-linecap="round"/>
  <path d="M356 338 C 404 392 398 436 356 462" fill="none" stroke="url(#qStroke)" stroke-width="30" stroke-linecap="round"/>

  <!-- 右下辉光 -->
  <circle cx="372" cy="392" r="72" fill="url(#glow)"/>

  <!-- 三个外部通道节点（对应 IM 通道：飞书 / QQ / 微信） -->
  <g fill="#E6FBFF">
    <circle cx="392" cy="120" r="9"/>
    <circle cx="120" cy="360" r="9"/>
    <circle cx="140" cy="118" r="9"/>
  </g>
  <g stroke="#E6FBFF" stroke-opacity="0.35" stroke-width="2.5" fill="none">
    <path d="M392 120 L300 165"/>
    <path d="M140 118 L200 175"/>
    <path d="M120 360 L185 240"/>
  </g>
</svg>
