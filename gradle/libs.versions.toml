[versions]
agp = "8.13.2"
kotlin = "2.3.10"
composeBom = "2026.01.01"
coreKtx = "1.15.0"
appcompat = "1.7.0"
material = "1.12.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
okhttp = "4.12.0"
coroutines = "1.9.0"
orgjson = "20240303"
shizuku = "13.1.5"
shizukuProvider = "13.1.5"
androidxWebkit = "1.12.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose BOM 统一管理 Compose 依赖版本
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
zxing-core = { group = "com.google.zxing", name = "core", version = "3.5.3" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
org-json = { group = "org.json", name = "json", version.ref = "orgjson" }

# Shizuku（L2 通道：ADB 级 IPC / 免 Root 系统执行）
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizukuProvider" }

# 应用内文档预览：WebViewAssetLoader 把 assets 与目标文件挂到同源 https，
# 让 WebView 拿到非 opaque origin（pdf.js Worker 可启动），并以流方式返回文件（去 base64 内存炸弹）
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidxWebkit" }

# 端侧 ASR 引擎 Sherpa-NCNN：未使用版本目录条目。
# 原因：Sherpa-NCNN 无 Maven Central / JitPack AAR（仓库根仅含 CMake，JitPack 构建全部失败）。
# 集成方式为「Kotlin 封装源码拷入 app/src/main/java/com/k2fsa/sherpa/ncnn/」+
# 「预编译 native .so 放入 app/src/main/jniLibs/arm64-v8a/」，无需 Gradle 坐标。
# 若后续改用自托管/第三方 AAR，请在此新增 [versions]/[libraries] 条目并在 app/build.gradle.kts 引用。

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
