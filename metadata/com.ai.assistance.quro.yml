AutoName: Zorv AI

# The assistant only connects to user-configured LLM endpoints
# (Gemini / OpenAI / Claude / Qwen / etc.). No tracking, no ads,
# no other non-free code or network dependency.
AntiFeatures:
  - NonFreeNet

Description: |
  Zorv AI is an on-device AI assistant hub for Android.

  Core features in the F-Droid build:
  * Configurable LLM chat — bring your own API key for Gemini, OpenAI, Claude, Qwen, and more.
  * Built-in open-source browser engine (GeckoView by Mozilla, MPL-2.0) — not the system WebView.
  * ACI (Agent Capability Interface): discover and invoke capabilities exposed by other apps.
  * Shizuku L2 channel for ADB-level IPC without root.
  * QuickJS-based local plugin runtime for automation scripts.

  Privacy:
  * No account required. No analytics, no telemetry, no advertising SDKs.
  * Your API keys are stored only on the device.

  Note on this F-Droid build:
  Offline speech recognition (Sherpa-NCNN) and the in-app Linux sandbox
  (proot) are not included, because their native libraries are not compiled
  from source in this distribution. All other functionality is identical to
  the main release.

